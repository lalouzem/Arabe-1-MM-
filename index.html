.opt.oar.long{font-size:20px}
.opt .vm{display:block;font-family:var(--ar);font-size:34px;line-height:1.3}
.opt .vl{display:block;font-size:13px;color:var(--muted)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}

.built{min-height:66px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-items:center;margin:8px 0 12px;background:var(--card)}

.fb .btn{margin-top:14px;min-width:180px}

,["قَرِيبٌ","Proche","Désigner"],["اِسْمُ اسْتِفْهَامٍ","Nom interrogatif","Questionner","Ex. : مَا , مَنْ"],["الْعَاقِلُ","Le doué de raison","Questionner","→ مَنْ"],["غَيْرُ عَاقِلٍ","Non doué de raison","Questionner","→ مَا"],["الطَّلَبُ","La demande","Questionner"],["الْمَسْؤُولُ عَنْهُ","Ce sur quoi porte la question","Questionner"],["أَقْسَامُ الْكَلِمَةِ","Les catégories de mots","Catégories de mots"],["حَرْفُ الِاسْتِفْهَامِ","Particule interrogative","Questionner"],["هَمْزَةُ الِاسْتِفْهَامِ","La hamza interrogative (أَ)","Questionner"]],"kind":"t"}],"cours":[["h","Introduction : les catégories de mots"],["term","أَقْسَامُ الْكَلِمَةِ","aqsâmou l-kalima","Les catégories du mot","En arabe, chaque mot appartient à l’une de 3 catégories : le nom, le verbe ou la particule."],["t",[["Catégorie","Terme arabe","Prononciation","Exemple"],["Le nom","الِاسْمُ","al-ismou","مُحَمَّدٌ"],["Le verbe","الْفِعْلُ","al-fi‘lou","ذَهَبَ"],["La particule","الْحَرْفُ","al-ḥarfou","إِلَى"]]],["li",["**Le nom** (اِسْمٌ, ismoun) désigne un être, un objet ou une idée : مُحَمَّدٌ, بَيْتٌ.","**Le verbe** (فِعْلٌ, fi‘loun) exprime une action liée à un temps : ذَهَبَ (dhahaba, il est allé).","**La particule** (حَرْفٌ, ḥarfoun) est un mot-outil qui ne prend tout son sens qu’avec d’autres mots : إِلَى (ilâ, vers)."]],["ex","ذَهَبَ مُحَمَّدٌ إِلَى الْمَسْجِدِ","Mohammed est allé à la mosquée : un verbe (ذَهَبَ), un nom (مُحَمَّدٌ), une particule (إِلَى) suivie d’un nom."],["h","هَذَا : ceci (proche)"],["term","اِسْمُ إِشَارَةٍ لِلْمُفْرَدِ الْمُذَكَّرِ الْقَرِيبِ","ismou ishâratin lil-moufradi l-moudhakkari l-qarîb","Nom démonstratif pour le singulier, masculin, proche","Sert à désigner un objet ou un être vivant, doué de raison ou non, qui est singulier (مُفْرَدٌ), masculin (مُذَكَّرٌ) et proche (قَرِيبٌ)."],["t",[["Mot","Prononciation","Sens"],["اِسْمٌ","ismoun","nom"],["إِشَارَةٌ","ishâratoun","désignation (démonstratif)"],["لِلْمُفْرَدِ","lil-moufradi","pour le singulier"],["الْمُذَكَّرِ","al-moudhakkari","masculin"],["الْقَرِيبِ","al-qarîbi","proche"]]],["ex","هَذَا بَيْتٌ","Ceci est une maison (hâdhâ baytoun). L’arabe n’exprime pas le verbe « être » au présent : il est sous-entendu."],["ex","هَذَا طَالِبٌ . هَذَا مَسْجِدٌ","Ceci est un étudiant. Ceci est une mosquée : هَذَا sert pour les personnes comme pour les choses."],["li",["Traduction courante : « ceci est » ; traduction littérale : « ceci » (sans le verbe être).","Se prononce **hâdhâ** mais s’écrit toujours sans le premier alif. Dans le moshaf (le Coran), on le trouve avec un petit alif : هٰذَا.","Décomposition : هَا, **حَرْفُ التَّنْبِيهِ** (ḥarfou t-tanbîh, particule qui attire l’attention) + ذَا, le véritable اِسْمُ إِشَارَةٍ.","Ce qui est désigné s’appelle **الْمُشَارُ إِلَيْهِ** (al-moushârou ilayh) : « celui qui a été désigné »."]],["ex","مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ","« Qui est celui qui peut intercéder auprès de Lui sans Sa permission ? » Ici, ذَا est employé seul comme démonstratif."],["h","مَا : qu’est-ce que ? (objet, animal)"],["term","اِسْمُ اسْتِفْهَامٍ يُسْأَلُ بِهِ عَنْ غَيْرِ الْعَاقِلِ","ismou stifhâmin yous’alou bihi ‘an ghayri l-‘âqil","Nom interrogatif utilisé pour interroger sur ce qui n’est pas doué de raison","Objets, animaux, plantes : tout ce qui est غَيْرُ عَاقِلٍ (ghayrou ‘âqilin)."],["ex","مَا هَذَا ؟ هَذَا بَيْتٌ","Qu’est-ce que c’est ? C’est une maison. Traduction littérale : « Quoi cela ? »"],["li",["L’arabe fait une différence entre le doué de raison, **الْعَاقِلُ** (al-‘âqil), et le non doué de raison, **غَيْرُ عَاقِلٍ**.","Demander مَا هَذَا ؟ en montrant une personne est faux, voire insultant : cela revient à dire « qu’est-ce que c’est ? ».","Devant un nom : مَا هَذَا ؟ Devant un verbe, on dit **مَاذَا** (mâdhâ) : مَاذَا تَدْرُسُ ؟ (Qu’est-ce que tu étudies ?).","Origine : اِسْتِـ exprime souvent la demande, **الطَّلَبُ** (aṭ-ṭalab), et les lettres ف ه م la compréhension (فَهْمٌ, fahm). اِسْتِفْهَامٌ = « demander la compréhension », d’où « interrogatif ».","Ce sur quoi porte la question s’appelle **الْمَسْؤُولُ عَنْهُ** (al-mas’oûlou ‘anhou). Le responsable d’une personne se dit d’ailleurs الْمَسْؤُولُ : celui qu’on interroge en cas de problème."]],["h","مَنْ : qui ? (personne)"],["term","اِسْمُ اسْتِفْهَامٍ يُسْأَلُ بِهِ عَنِ الْعَاقِلِ","ismou stifhâmin yous’alou bihi ‘ani l-‘âqil","Nom interrogatif utilisé pour interroger sur un être doué de raison","Les êtres humains, mais aussi les anges et les djinns."],["ex","مَنْ هَذَا ؟ هَذَا طَبِيبٌ","Qui est-ce ? C’est un médecin. Traduction littérale : « Qui celui-ci ? »"],["li",["Il serait faux d’employer مَنْ هَذَا ؟ pour un être inanimé (plante, paysage) ou un animal (chat, cheval) : on dit مَا.","Attention : pour les anges et les djinns, on utilise مَنْ et non مَا."]],["h","أَ : est-ce que ? (réponse par oui ou non)"],["term","حَرْفُ الِاسْتِفْهَامِ","ḥarfou l-istifhâm","Particule interrogative","Celui qui pose la question propose une réponse et attend sa confirmation par نَعَمْ (na‘am, oui) ou son infirmation par لَا (lâ, non)."],["ex","أَ هَذَا بَيْتٌ ؟ نَعَمْ، هَذَا بَيْتٌ","Est-ce une maison ? Oui, c’est une maison : réponse positive."],["ex","أَ هَذَا بَيْتٌ ؟ لَا، هَذَا مَسْجِدٌ","Est-ce une maison ? Non, c’est une mosquée : réponse négative, puis correction."],["li",["C’est un **حَرْفٌ** (particule) : il ne peut avoir de rôle grammatical.","On fait suivre نَعَمْ ou لَا d’une **virgule** afin d’éviter tout contresens.","Autre nom : **هَمْزَةُ الِاسْتِفْهَامِ** (hamzatou l-istifhâm), la hamza interrogative.","La famille des interrogatifs n’est composée que de **أَسْمَاءٌ** (noms), sauf deux **حُرُوفٌ** (particules) : أَ et هَلْ."]],["tip","Résumé : une personne → مَنْ ; une chose ou un animal → مَا ; une réponse par oui ou non → أَ."],["h","Fiche de synthèse : vocabulaire grammatical"],["t",[["Arabe","Prononciation","Sens"],["اِسْمٌ","ismoun","Nom"],["فِعْلٌ","fi‘loun","Verbe"],["حَرْفٌ","ḥarfoun","Particule"],["اِسْمُ إِشَارَةٍ","ismou ishâratin","Pronom démonstratif"],["مُفْرَدٌ","moufradoun","Singulier"],["مُذَكَّرٌ","moudhakkaroun","Masculin"],["قَرِيبٌ","qarîboun","Proche"],["الْمُشَارُ إِلَيْهِ","al-moushârou ilayh","Ce qui est désigné"],["حَرْفُ التَّنْبِيهِ","ḥarfou t-tanbîh","Particule pour attirer l’attention"],["اِسْمُ اسْتِفْهَامٍ","ismou stifhâmin","Nom interrogatif"],["حَرْفُ الِاسْتِفْهَامِ","ḥarfou l-istifhâm","Particule interrogative"],["الْعَاقِلُ","al-‘âqil","Le doué de raison"],["غَيْرُ عَاقِلٍ","ghayrou ‘âqilin","Le non doué de raison"],["الطَّلَبُ","aṭ-ṭalab","La demande"],["الْمَسْؤُولُ عَنْهُ","al-mas’oûlou ‘anhou","Ce sur quoi porte la question"]]]],"stat":[["مَنْ / مَا","Cette question sert à interroger sur…","مَا هَذَا ؟",["Un objet ou un animal","Une personne","Un lieu éloigné"],"مَا : pour ce qui n’est pas doué de raison (غَيْرُ عَاقِلٍ)."],["مَنْ / مَا","Pour demander qui est une personne, on dit :","",["مَنْ هَذَا ؟","مَا هَذَا ؟","أَ هَذَا ؟"],"مَنْ : pour un être doué de raison (الْعَاقِلُ)."],["مَنْ / مَا","Poser cette question en montrant une personne, c’est…","مَا هَذَا ؟",["Faux, voire insultant","Correct et poli","Correct si elle est loin"],"Cela revient à demander « qu’est-ce que c’est ? » à propos d’une personne."],["مَنْ / مَا","Pour les anges et les djinns, on utilise :","",["مَنْ","مَا","أَ"],"Ils sont doués de raison → مَنْ."],["هَذَا","Ce mot désigne ce qui est…","هَذَا",["Singulier, masculin, proche","Singulier, masculin, éloigné","Pluriel, proche"],"هَذَا : اِسْمُ إِشَارَةٍ pour le singulier masculin proche."],["هَذَا","Ce mot se prononce…","هَذَا",["hâdhâ (un alif non écrit)","hadha (sans alif)","hâdhâka"],"On prononce un alif après le ه sans l’écrire (petit alif dans le Coran : هٰذَا)."],["هَذَا","Dans هَذَا, le هَا est…","",["Une particule pour attirer l’attention","Le vrai démonstratif","Une particule interrogative"],"هَا = حَرْفُ التَّنْبِيهِ ; le vrai démonstratif est ذَا."],["أَ : oui / non","Cette question attend une réponse…","أَ هَذَا بَيْتٌ ؟",["Par oui (نَعَمْ) ou non (لَا)","Par un nom de personne","Par un lieu"],"Avec أَ, on propose une réponse : on confirme ou on infirme."],["أَ : oui / non","C’est une clé. Bonne réponse :","أَ هَذَا قَلَمٌ ؟",["لَا، هَذَا مِفْتَاحٌ","نَعَمْ، هَذَا مِفْتَاحٌ","لَا، هَذَا قَلَمٌ"],"Ce n’est pas un crayon → لَا, puis on corrige."],["أَ : oui / non","Après نَعَمْ ou لَا, on met…","",["Une virgule","Un point d’interrogation","Rien"],"La virgule évite les contresens : لَا، هَذَا مَسْجِدٌ."],["Catégories de mots","Ce mot est…","أَ",["Une particule (حَرْفٌ)","Un nom (اِسْمٌ)","Un verbe (فِعْلٌ)"],"Les interrogatifs sont des noms, sauf deux particules : أَ et هَلْ."],["Catégories de mots","Quels interrogatifs sont des particules ?","",["أَ et هَلْ","مَا et مَنْ","مَنْ et أَ"],"Tous les autres interrogatifs sont des noms."],["مَنْ / مَا","Devant un verbe, « qu’est-ce que » se dit :","",["مَاذَا","مَا","مَنْ"],"مَاذَا تَدْرُسُ ؟ = Qu’est-ce que tu étudies ?"],["Termes L1","Ce sur quoi porte la question s’appelle :","",["الْمَسْؤُولُ عَنْهُ","الْمُشَارُ إِلَيْهِ","حَرْفُ التَّنْبِيهِ"],"Littéralement : « celui sur lequel on pose la question »."],["Termes L1","Ce qui est désigné par هَذَا s’appelle :","",["الْمُشَارُ إِلَيْهِ","الْمَسْؤُولُ عَنْهُ","الْعَاقِلُ"],"« Celui qui a été désigné »."],["هَذَا","Traduis :","هَذَا بَيْتٌ",["Ceci est une maison","Cette maison","Est-ce une maison ?"],"Pas de verbe « être » en arabe : il est sous-entendu."],["مَنْ / مَا","Traduis :","مَنْ هَذَا ؟ هَذَا مُدَرِّسٌ",["Qui est-ce ? C’est un professeur.","Qu’est-ce que c’est ? C’est un bureau.","Est-ce un professeur ? Oui."],"مَنْ = qui ; مُدَرِّسٌ = professeur."],["Termes L1","Le mot اِسْتِفْهَامٌ signifie littéralement…","",["Demander à comprendre","Désigner un objet","Attirer l’attention"],"اِسْتِـ = demande (الطَّلَبُ) ; فَهْمٌ = compréhension."],["هَذَا","Vrai ou faux ? هَذَا est un اِسْمُ إِشَارَةٍ pour le singulier, masculin, proche.","",["Vrai","Faux"],"Vrai : هَذَا est un اِسْمُ إِشَارَةٍ لِلْمُفْرَدِ الْمُذَكَّرِ الْقَرِيبِ (ismou ishâratin lil-moufradi l-moudhakkari l-qarîb)."],["هَذَا","Vrai ou faux ? On ne peut pas employer هَذَا pour désigner une personne.","هَذَا طَالِبٌ",["Faux","Vrai"],"Faux : هَذَا désigne un être doué de raison ou non : هَذَا طَالِبٌ (ceci est un étudiant), هَذَا بَيْتٌ (ceci est une maison)."],["هَذَا","Comment s’écrit et se prononce هَذَا ?","هَذَا",["Prononcé hâdhâ, écrit sans le premier alif","Prononcé hadha, sans voyelle longue","Prononcé hâdhihi"],"Il se prononce hâdhâ mais s’écrit toujours sans le premier alif ; dans le Coran, on le trouve avec un petit alif : هٰذَا."],["هَذَا","هَذَا se compose de deux éléments. Lesquels ?","",["هَا (حَرْفُ التَّنْبِيهِ) + ذَا (اِسْمُ إِشَارَةٍ)","هَا (اِسْمُ إِشَارَةٍ) + ذَا (حَرْفُ التَّنْبِيهِ)","هَـ (pronom) + ذَا (verbe)"],"هَا est la particule qui attire l’attention, حَرْفُ التَّنْبِيهِ (ḥarfou t-tanbîh) ; le véritable démonstratif est ذَا."],["هَذَا","Que signifie حَرْفُ التَّنْبِيهِ (ḥarfou t-tanbîh) ?","",["Particule pour attirer l’attention","Particule interrogative","Nom démonstratif"],"C’est le هَا de هَذَا : il attire l’attention de l’interlocuteur sur ce qu’on désigne."],["Termes L1","Que désigne الْمُشَارُ إِلَيْهِ (al-moushârou ilayh) ?","هَذَا بَيْتٌ",["Ce qui est désigné par le démonstratif","Celui qui pose la question","La particule qui attire l’attention"],"الْمُشَارُ إِلَيْهِ = « celui qui a été désigné » : dans هَذَا بَيْتٌ, c’est بَيْتٌ."],["Catégories de mots","Dans cette phrase, quel mot est un فِعْلٌ (verbe) ?","ذَهَبَ مُحَمَّدٌ إِلَى الْمَسْجِدِ",["ذَهَبَ","مُحَمَّدٌ","إِلَى"],"ذَهَبَ (dhahaba, il est allé) exprime une action : c’est un فِعْلٌ. مُحَمَّدٌ est un اِسْمٌ, إِلَى un حَرْفٌ."],["Catégories de mots","Vrai ou faux ? إِلَى est un اِسْمٌ (nom).","إِلَى",["Faux","Vrai"],"Faux : إِلَى (ilâ, vers) est un حَرْفٌ (ḥarf), une particule : un mot-outil qui ne prend sens qu’avec d’autres mots."],["Catégories de mots","Combien y a-t-il de catégories de mots, أَقْسَامُ الْكَلِمَةِ ?","",["3 : le nom, le verbe, la particule","2 : le nom et le verbe","4 : le nom, le verbe, la particule, l’adjectif"],"أَقْسَامُ الْكَلِمَةِ (aqsâmou l-kalima) : الِاسْمُ (le nom), الْفِعْلُ (le verbe) et الْحَرْفُ (la particule)."],["مَنْ / مَا","Complète la question (on montre un médecin) :","…… هَذَا ؟ هَذَا طَبِيبٌ",["مَنْ","مَا","أَ"],"Un médecin est doué de raison (عَاقِلٌ) : on interroge avec مَنْ (man, qui ?)."],["مَنْ / مَا","Complète la question (on montre un chat) :","…… هَذَا ؟ هَذَا قِطٌّ",["مَا","مَنْ","مَاذَا"],"Un chat n’est pas doué de raison (غَيْرُ عَاقِلٍ) : on dit مَا. مَاذَا s’emploie devant un verbe."],["مَنْ / مَا","Vrai ou faux ? Pour parler d’un ange ou d’un djinn, on utilise مَا.","",["Faux","Vrai"],"Faux : les anges et les djinns sont doués de raison. On utilise مَنْ et non مَا."],["مَنْ / مَا","Comment dit-on « Qu’est-ce que tu étudies ? »","",["مَاذَا تَدْرُسُ ؟","مَا تَدْرُسُ ؟","مَنْ تَدْرُسُ ؟"],"Devant un verbe (تَدْرُسُ, tu étudies), on utilise مَاذَا (mâdhâ) ; مَا s’emploie devant un nom : مَا هَذَا ؟"],["مَنْ / مَا","Cas pratique : tu croises un inconnu avec un ami. Que demandes-tu à ton ami ?","",["مَنْ هَذَا ؟","مَا هَذَا ؟","أَ هَذَا ؟"],"Pour une personne : مَنْ هَذَا ؟ (qui est-ce ?). مَا هَذَا ؟ signifierait « qu’est-ce que c’est ? » : faux, voire insultant."],["Termes L1","اِسْمُ اسْتِفْهَامٍ (ismou stifhâm) signifie littéralement…","",["Le nom qui sert à demander la compréhension","Le nom qui sert à désigner","La particule qui attire l’attention"],"اِسْتِـ exprime la demande (الطَّلَبُ) et فَهْمٌ la compréhension : اِسْتِفْهَامٌ = « demander à comprendre », d’où « nom interrogatif »."],["Termes L1","Comment appelle-t-on ce sur quoi porte la question ?","",["الْمَسْؤُولُ عَنْهُ","الْمُشَارُ إِلَيْهِ","الْعَاقِلُ"],"الْمَسْؤُولُ عَنْهُ (al-mas’oûlou ‘anhou) : littéralement « celui sur lequel on pose une question »."],["Termes L1","Vrai ou faux ? غَيْرُ عَاقِلٍ désigne un être doué de raison.","",["Faux","Vrai"],"Faux : غَيْرُ عَاقِلٍ (ghayrou ‘âqilin) = non doué de raison (objet, animal, plante). Le doué de raison se dit الْعَاقِلُ (al-‘âqil)."],["أَ : oui / non","Complète la réponse (l’image montre une mosquée) :","أَ هَذَا بَيْتٌ ؟ …… ، هَذَا مَسْجِدٌ",["لَا","نَعَمْ","مَا"],"Ce n’est pas une maison : on infirme avec لَا (lâ, non), suivi d’une virgule, puis on corrige."],["أَ : oui / non","Vrai ou faux ? أَ est un اِسْمُ اسْتِفْهَامٍ (nom interrogatif).","",["Faux","Vrai"],"Faux : أَ est un حَرْفُ اسْتِفْهَامٍ (particule interrogative). Les interrogatifs sont des noms, sauf deux particules : أَ et هَلْ."],["أَ : oui / non","Pourquoi met-on une virgule après نَعَمْ ou لَا ?","لَا، هَذَا مَسْجِدٌ",["Pour éviter tout contresens","Parce que لَا est un verbe","Pour marquer le pluriel"],"Sans virgule, la réponse pourrait se lire comme une négation de la phrase entière. La virgule sépare la réponse de la correction."],["أَ : oui / non","Quel est l’autre nom de la particule أَ ?","",["هَمْزَةُ الِاسْتِفْهَامِ","هَمْزَةُ الْوَصْلِ","حَرْفُ التَّنْبِيهِ"],"أَ s’appelle aussi هَمْزَةُ الِاسْتِفْهَامِ (hamzatou l-istifhâm), la hamza interrogative."],["أَ : oui / non","Traduis : « Est-ce un chien ? Non, c’est un chat. »","",["أَ هَذَا كَلْبٌ ؟ لَا، هَذَا قِطٌّ","مَا هَذَا كَلْبٌ ؟ لَا، هَذَا قِطٌّ","أَ هَذَا قِطٌّ ؟ نَعَمْ، هَذَا كَلْبٌ"],"On propose une réponse avec أَ, on infirme avec لَا, puis on corrige : هَذَا قِطٌّ."],["مَنْ / مَا","Complète la question (on montre un coq) :","…… هَذَا ؟ هَذَا دِيكٌ",["مَا","مَنْ","أَ"],"Un coq (دِيكٌ, dîkoun) n’est pas doué de raison : on dit مَا."],["مَنْ / مَا","Complète la question (on montre un commerçant) :","…… هَذَا ؟ هَذَا تَاجِرٌ",["مَنْ","مَا","أَ"],"Un commerçant (تَاجِرٌ, tâjiroun) est doué de raison : on dit مَنْ."],["مَنْ / مَا","Complète la question (on montre un instituteur) :","…… هَذَا ؟ هَذَا مُدَرِّسٌ",["مَنْ","مَا","مَاذَا"],"مُدَرِّسٌ (moudarrisoun, instituteur) est une personne : مَنْ."],["مَنْ / مَا","Choisis la bonne réponse :","مَا هَذَا ؟",["هَذَا جَمَلٌ","هَذَا رَجُلٌ","هَذَا طَبِيبٌ"],"مَا interroge sur un non doué de raison : la réponse est un animal ou un objet, ici جَمَلٌ (chameau). رَجُلٌ et طَبِيبٌ sont des personnes."],["مَنْ / مَا","Choisis la bonne réponse :","مَنْ هَذَا ؟",["هَذَا وَلَدٌ","هَذَا قِطٌّ","هَذَا مِنْدِيلٌ"],"مَنْ interroge sur une personne : وَلَدٌ (waladoun, enfant)."],["أَ : oui / non","Réponds (l’image montre un chat) :","أَ هَذَا كَلْبٌ ؟",["لَا، هَذَا قِطٌّ","نَعَمْ، هَذَا كَلْبٌ","لَا، هَذَا كَلْبٌ"],"Ce n’est pas un chien : لَا, puis on corrige : هَذَا قِطٌّ (révision p. 16)."],["أَ : oui / non","Réponds (l’image montre un mouchoir) :","أَ هَذَا قَمِيصٌ ؟",["لَا، هَذَا مِنْدِيلٌ","نَعَمْ، هَذَا قَمِيصٌ","لَا، هَذَا قَمِيصٌ"],"Ce n’est pas une chemise : لَا، هَذَا مِنْدِيلٌ (c’est un mouchoir)."],["أَ : oui / non","Réponds (l’image montre un âne) :","أَ هَذَا حِمَارٌ ؟",["نَعَمْ، هَذَا حِمَارٌ","لَا، هَذَا حِمَارٌ","نَعَمْ، هَذَا حِصَانٌ"],"C’est bien un âne : on confirme avec نَعَمْ, suivi d’une virgule."],["أَ : oui / non","Réponds (l’image montre un cheval) :","أَ هَذَا حِمَارٌ ؟",["لَا، هَذَا حِصَانٌ","نَعَمْ، هَذَا حِمَارٌ","لَا، هَذَا حِمَارٌ"],"C’est un cheval (حِصَانٌ, ḥiṣânoun) et non un âne : لَا، هَذَا حِصَانٌ (révision p. 16)."],["هَذَا","Traduis : « Ceci est une étoile. »","",["هَذَا نَجْمٌ","هَذَا قَمَرٌ","مَا هَذَا نَجْمٌ"],"نَجْمٌ (najmoun) = étoile ; هَذَا pour le proche ; pas de verbe « être »."],["هَذَا","Traduis : « Ceci est une clé. »","",["هَذَا مِفْتَاحٌ","هَذَا مِنْدِيلٌ","هَذَا مَكْتَبٌ"],"مِفْتَاحٌ (miftâḥoun) = clé."],["هَذَا","Que signifie cette phrase ?","هَذَا سَرِيرٌ",["Ceci est un lit.","Ceci est une chaise.","Ceci est un bureau."],"سَرِيرٌ (sarîroun) = lit."],["هَذَا","Vrai ou faux ? Pour dire « Ceci est une maison », il faut un verbe « être » en arabe.","هَذَا بَيْتٌ",["Faux","Vrai"],"Faux : au présent, le verbe « être » est sous-entendu : هَذَا بَيْتٌ suffit."],["مَنْ / مَا","Que signifie cette qu ,"Loin / éloigné","Adjectifs des textes","≠ قَرِيبٌ"],["مُجْتَهِدٌ","Travailleur / assidu","Adjectifs des textes","≠ كَسْلَانُ"],["كَسْلَانُ","Paresseux","Adjectifs des textes","≠ مُجْتَهِدٌ"]],"kind":"x"}],"cours":[["h","Le défini et l’indéfini : النَّكِرَةُ وَالْمَعْرِفَةُ"],["term","النَّكِرَةُ","an-nakira","L’indéfini","Le mot indéfini porte le tanwin, التَّنْوِينُ (at-tanwîn) : la voyelle finale doublée ـٌ ـٍ ـً, prononcée oun, in, an. بَيْتٌ = UNE maison."],["term","الْمَعْرِفَةُ","al-ma‘rifa","Le défini","Un mot devient défini avec l’article الـ. الْبَيْتُ = LA maison."],["t",[["Indéfini","Prononciation","Défini","Prononciation"],["بَيْتٌ","baytoun","الْبَيْتُ","al-baytou"],["قَلَمٌ","qalamoun","الْقَلَمُ","al-qalamou"],["كِتَابٌ","kitâboun","الْكِتَابُ","al-kitâbou"],["جَمَلٌ","jamaloun","الْجَمَلُ","al-jamalou"]]],["li",["Avec الـ, il est **interdit** de mettre un tanwin : الْبَيْتُ, jamais الْبَيْتٌ.","Attention : les **noms propres** portent un tanwin mais sont **définis** : مُحَمَّدٌ.","Autre moyen de rendre un nom défini : **الإِضَافَةُ** (al-iḍâfa), vue en leçon 5.","Vocabulaire : اِسْمٌ نَكِرَةٌ (ismoun nakira) = nom indéfini ; اِسْمٌ مَعْرِفَةٌ (ismoun ma‘rifa) = nom défini."]],["h","La hamza : الْهَمْزَةُ"],["term","هَمْزَةُ الْقَطْعِ","hamzatou l-qaṭ‘","La hamza toujours prononcée","Elle se prononce toujours, en début comme en milieu de phrase. Elle s’écrit أ, mais aussi إ ، ؤ ، ئ ، ء. Exemple : خَرَجَ أَحْمَدُ (kharaja aḥmadou)."],["term","هَمْزَةُ الْوَصْلِ","hamzatou l-waṣl","La hamza de liaison","Elle ne se prononce que si le mot qui la porte **commence la phrase**, jamais lorsqu’un mot la précède. Elle est portée par l’alif de الـ et par certains mots, comme اِسْمٌ."],["ex","اَلْوَلَدُ جَالِسٌ","En début de phrase, on prononce « al-waladou jâlisoun » : la fatha de la hamza de liaison se prononce."],["ex","مَا اسْمُكَ ؟","Après un mot, on lit « mâ smouka » et non « mâ ismouka » : la hamza de liaison est muette pour faire la liaison. Dans le Coran, on l’écrit avec la wasla ٱ."],["h","Les lettres solaires et lunaires"],["p","Les 28 lettres de l’alphabet se divisent en 2 familles de 14. Elles décident si le ل de الـ se prononce ou non."],["term","الْحُرُوفُ الْقَمَرِيَّةُ","al-ḥouroûfou l-qamariyya","Les lettres lunaires","Devant elles, le ل de الـ **se prononce** et porte un soukoun, سُكُونٌ (soukoûn). Exemple : بَابٌ + الْ = الْبَابُ (al-bâbou)."],["term","الْحُرُوفُ الشَّمْسِيَّةُ","al-ḥouroûfou sh-shamsiyya","Les lettres solaires","Devant elles, le ل de الـ **ne se prononce pas** et la lettre solaire prend une chadda, شَدَّةٌ (shadda) : elle est doublée. Exemple : دِيكٌ + الْ = الدِّيكُ (ad-dîkou)."],["t",[["","Lettres solaires (14)","Lettres lunaires (14)"],["Lettres","ت ث د ذ ر ز س ش ص ض ط ظ ل ن","ا ب ج ح خ ع غ ف ق ك م و ه ي"],["Le ل de الـ","Muet","Prononcé"],["Signe","Chadda sur la lettre","Soukoun sur le ل"],["Exemple","الشَّمْسُ (ash-shamsou)","الْقَمَرُ (al-qamarou)"]]],["t",[["Lettre solaire","Exemple","Prononciation"],["ت","التَّاجِرُ","at-tâjirou"],["ث","الثَّوْبُ","ath-thawbou"],["د","الدِّيكُ","ad-dîkou"],["ذ","الذَّهَبُ","adh-dhahabou"],["ر","الرَّجُلُ","ar-rajoulou"],["ز","الزَّهْرَةُ","az-zahratou"],["س","السَّمَكُ","as-samakou"],["ش","الشَّمْسُ","ash-shamsou"],["ص","الصَّدْرُ","aṣ-ṣadrou"],["ض","الضَّيْفُ","aḍ-ḍayfou"],["ط","الطَّالِبُ","aṭ-ṭâlibou"],["ظ","الظُّهْرُ","aẓ-ẓouhrou"],["ل","اللَّحْمُ","al-laḥmou"],["ن","النَّجْمُ","an-najmou"]]],["t",[["Lettre lunaire","Exemple","Prononciation"],["أ","الْأَبُ","al-abou"],["ب","الْبَابُ","al-bâbou"],["ج","الْجَنَّةُ","al-jannatou"],["ح","الْحِمَارُ","al-ḥimârou"],["خ","الْخُبْزُ","al-khoubzou"],["ع","الْعَيْنُ","al-‘aynou"],["غ","الْغَدَاءُ","al-ghadâ’ou"],["ف","الْفَمُ","al-famou"],["ق","الْقَمَرُ","al-qamarou"],["ك","الْكَلْبُ","al-kalbou"],["م","الْمَاءُ","al-mâ’ou"],["و","الْوَلَدُ","al-waladou"],["ه","الْهَوَاءُ","al-hawâ’ou"],["ي","الْيَدُ","al-yadou"]]],["tip","Astuce (hors livre) : les 14 lettres lunaires forment la phrase أَبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ. Une lettre absente de cette phrase est solaire."],["h","En milieu de phrase : الـ précédé d’un mot"],["ex","هَذَا الْبَابُ مَفْتُوحٌ","« hâdhâ l-bâbou maftoûḥoun » : on ne prononce pas la hamza de liaison, mais on prononce le ل, car ب est une lettre lunaire."],["ex","هَذَا الرَّجُلُ مُجْتَهِدٌ","« hâdhâ r-rajoulou moujtahidoun » : on ne prononce ni la hamza de liaison ni le ل, car ر est une lettre solaire."],["tip","Résumé : indéfini → tanwin ; défini → الـ sans tanwin. Lettre lunaire → al- ; lettre solaire → lettre doublée. Hamza de liaison → muette après un mot."],["h","Fiche de synthèse : vocabulaire grammatical"],["t",[["Arabe","Prononciation","Sens"],["نَكِرَةٌ","nakira","Indéfini"],["اِسْمٌ نَكِرَةٌ","ismoun nakira","Nom indéfini"],["مَعْرِفَةٌ","ma‘rifa","Défini"],["اِسْمٌ مَعْرِفَةٌ","ismoun ma‘rifa","Nom défini"],["التَّنْوِينُ","at-tanwîn","Le tanwin (ـٌ ـٍ ـً)"],["الإِضَافَةُ","al-iḍâfa","Le complément du nom (leçon 5)"],["هَمْزَةُ الْقَطْعِ","hamzatou l-qaṭ‘","La hamza prononcée"],["هَمْزَةُ الْوَصْلِ","hamzatou l-waṣl","La hamza de liaison"],["الْحُرُوفُ الشَّمْسِيَّةُ","al-ḥouroûfou sh-shamsiyya","Les lettres solaires"],["الْحُرُوفُ الْقَمَرِيَّةُ","al-ḥouroûfou l-qamariyya","Les lettres lunaires"],["السُّكُونُ","as-soukoûn","Le soukoun (ـْ)"],["الشَّدَّةُ","ash-shadda","La chadda (ـّ)"]]]],"stat":[["Défini / indéfini","Un mot indéfini (نَكِرَةٌ) porte…","",["Le tanwin","الـ","Une chadda"],"بَيْتٌ = une maison."],["Défini / indéfini","Un mot devient défini (مَعْرِفَةٌ) avec…","",["الـ","Le tanwin","وَ"],"الْبَيْتُ = la maison."],["Défini / indéfini","Avec الـ, le tanwin est…","",["Interdit","Obligatoire","Facultatif"],"الْبَيْتُ, jamais الْبَيْتٌ."],["Défini / indéfini","Ce nom propre porte un tanwin. Il est…","مُحَمَّدٌ",["Défini","Indéfini","Ni l’un ni l’autre"],"Les noms propres sont définis malgré le tanwin."],["Défini / indéfini","Autre moyen de rendre un nom défini (leçon 5) :","",["الإِضَافَةُ","هَمْزَةُ الْوَصْلِ","التَّنْوِينُ"],"À voir en leçon 5."],["Hamza","هَمْزَةُ الْقَطْعِ se prononce…","",["Toujours","Seulement en début de phrase","Jamais"],"Ex. : خَرَجَ أَحْمَدُ."],["Hamza","هَمْزَةُ الْوَصْلِ se prononce…","",["Seulement en début de phrase","Toujours","Jamais"],"Après un mot, elle est muette (liaison)."],["Hamza","Comment lit-on ?","مَا اسْمُكَ ؟",["mâ smouka","mâ ismouka","mâ asmouka"],"La hamza wasl de اسْم est muette après un mot."],["Hamza","Comment lit-on ?","الْوَلَدُ جَالِسٌ",["al-waladou jâlisoun","l-waladou jâlisoun","waladou jâlisoun"],"Début de phrase : la hamza wasl se prononce."],["Lettres solaires / lunaires","Combien de lettres solaires ?","",["14","7","28"],"28 lettres : 14 solaires, 14 lunaires."],["Lettres solaires / lunaires","Avec une lettre solaire, الـ…","",["ل muet + chadda sur la lettre","ل prononcé avec soukoun","On ajoute un tanwin"],"Ex. : الشَّمْسُ (ash-shamsou)."],["Lettres solaires / lunaires","Avec une lettre lunaire, الـ…","",["ل prononcé avec soukoun","ل muet + chadda","On ajoute un tanwin"],"Ex. : الْقَمَرُ (al-qamarou)."],["Lettres solaires / lunaires","Comment lit-on ?","هَذَا الْبَابُ مَفْتُوحٌ",["hâdhâ l-bâbou maftouhoun","hâdhâ al-bâbou maftouhoun","hâdhâ b-bâbou maftouhoun"],"Hamza wasl muette (un mot avant), ل prononcé (ب lunaire)."],["Lettres solaires / lunaires","Comment lit-on ?","هَذَا الرَّجُلُ مُجْتَهِدٌ",["hâdhâ r-rajoulou moujtahidoun","hâdhâ l-rajoulou moujtahidoun","hâdhâ ar-rajoulou moujtahidoun"],"Ni hamza ni ل : ر est solaire."],["Lettres solaires / lunaires","Comment lit-on ?","الدِّيكُ جَمِيلٌ",["ad-dîkou jamîloun","al-dîkou jamîloun","dîkou jamîloun"],"Début de phrase : hamza prononcée ; د est solaire : ل muet."],["Défini / indéfini","Vrai ou faux ? On peut écrire الْبَيْتٌ.","",["Faux","Vrai"],"Faux : avec الـ, le tanwin est interdit. On écrit الْبَيْتُ."],["Défini / indéfini","Que signifie النَّكِرَةُ (an-nakira) ?","",["L’indéfini","Le défini","La hamza"],"النَّكِرَةُ : le mot indéfini, reconnaissable à son tanwin (بَيْتٌ = une maison)."],["Défini / indéfini","Quel est le signe d’un mot indéfini ?","",["Le tanwin (ـٌ ـٍ ـً)","L’article الـ","La chadda"],"التَّنْوِينُ (at-tanwîn) : la voyelle finale doublée, prononcée oun, in, an."],["Défini / indéfini","Vrai ou faux ? مُحَمَّدٌ porte un tanwin, il est donc indéfini.","مُحَمَّدٌ",["Faux","Vrai"],"Faux : les noms propres portent un tanwin mais sont définis (مَعْرِفَةٌ)."],["Défini / indéfini","Rends ce mot défini :","قَلَمٌ",["الْقَلَمُ","الْقَلَمٌ","قَلَمُ"],"On ajoute الـ et on supprime le tanwin : الْقَلَمُ (al-qalamou)."],["Défini / indéfini","Quel autre moyen rend un nom défini (leçon 5) ?","",["الإِضَافَةُ","التَّنْوِينُ","هَمْزَةُ الْوَصْلِ"],"الإِضَافَةُ (al-iḍâfa) : le complément du nom, vu en leçon 5."],["Défini / indéfini","Complète avec le bon adjectif :","الْحَجَرُ ……",["ثَقِيلٌ","خَفِيفٌ","حُلْوٌ"],"La pierre est lourde : ثَقِيلٌ (thaqîloun). Le sujet est défini (الْحَجَرُ), l’attribut indéfini."],["Défini / indéfini","Traduis : « La pomme est délicieuse. »","",["التُّفَّاحُ لَذِيذٌ","تُفَّاحٌ لَذِيذٌ","التُّفَّاحُ اللَّذِيذُ"],"Sujet défini (التُّفَّاحُ) + attribut indéfini (لَذِيذٌ). ت est solaire : chadda sur le ت. التُّفَّاحُ اللَّذِيذُ voudrait dire « la pomme délicieuse », sans verbe."],["Hamza","Vrai ou faux ? هَمْزَةُ الْقَطْعِ se prononce toujours.","خَرَجَ أَحْمَدُ",["Vrai","Faux"],"Vrai : la hamza « coupante » se prononce en début comme en milieu de phrase : kharaja aḥmadou."],["Hamza","Vrai ou faux ? هَمْزَةُ الْوَصْلِ se prononce quand un mot la précède.","",["Faux","Vrai"],"Faux : elle ne se prononce qu’en début de phrase ; précédée d’un mot, elle est muette pour faire la liaison."],["Hamza","Comment lit-on cette phrase ?","مَا اسْمُكَ ؟",["mâ smouka","mâ ismouka","mâ asmouka"],"La hamza de اسْمٌ est une hamza de liaison : précédée de مَا, elle ne se prononce pas."],["Hamza","En début de phrase, la hamza de الـ…","اَلْوَلَدُ جَالِسٌ",["Se prononce : « al-waladou »","Ne se prononce pas : « l-waladou »","Est une هَمْزَةُ الْقَطْعِ"],"C’est une هَمْزَةُ الْوَصْلِ, mais le mot commence la phrase : sa fatha se prononce."],["Hamza","Quelle hamza porte l’article الـ ?","",["هَمْزَةُ الْوَصْلِ","هَمْزَةُ الْقَطْعِ","هَمْزَةُ الِاسْتِفْهَامِ"],"L’alif de الـ porte une hamza de liaison (hamzatou l-waṣl)."],["Lettres solaires / lunaires","Vrai ou faux ? Devant une lettre solaire, le ل de الـ se prononce.","",["Faux","Vrai"],"Faux : devant une lettre solaire, le ل est muet et la lettre prend une chadda : الشَّمْسُ (ash-shamsou)."],["Lettres solaires / lunaires","Combien y a-t-il de lettres solaires ?","",["14","7","28"],"28 lettres : 14 solaires (الشَّمْسِيَّةُ) et 14 lunaires (الْقَمَرِيَّةُ)."],["Lettres solaires / lunaires","Comment lit-on ce mot ?","الدِّيكُ",["ad-dîkou","al-dîkou","ad-dikou"],"د est solaire : le ل ne se prononce pas et le د est doublé par la chadda."],["Lettres solaires / lunaires","Quelle lettre est lunaire ?","",["ق","ش","ن"],"ق est lunaire (الْقَمَرُ, al-qamarou). ش et ن sont solaires."],["Lettres solaires / lunaires","Écris correctement « le soleil » :","",["الشَّمْسُ","الْشَمْسُ","الشَّمْسٌ"],"ش est solaire : chadda sur ش, pas de soukoun sur le ل, et pas de tanwin avec الـ."],["Lettres solaires / lunaires","Écris correctement « la porte » :","",["الْبَابُ","البَّابُ","الْبَابٌ"],"ب est lunaire : le ل porte un soukoun et se prononce : al-bâbou."],["Lettres solaires / lunaires","Comment lit-on cette phrase ?","هَذَا الرَّجُلُ مُجْتَهِدٌ",["hâdhâ r-rajoulou moujtahidoun","hâdhâ l-rajoulou moujtahidoun","hâdhâ al-rajoulou moujtahidoun"],"Après un mot, la hamza de liaison est muette ; ر est solaire : le ل ne se prononce pas non plus."],["Lettres solaires / lunaires","Comment lit-on cette phrase ?","هَذَا الْبَابُ مَفْتُوحٌ",["hâdhâ l-bâbou maftoûḥoun","hâdhâ al-bâbou maftoûḥoun","hâdhâ b-bâbou maftoûḥoun"],"La hamza de liaison est muette, mais le ل se prononce car ب est lunaire."],["Lettres solaires / lunaires","Les 14 lettres lunaires sont réunies dan za","items":[["En début de phrase, la هَمْزَةُ الْوَصْلِ…","",["Se prononce","Ne se prononce pas","Devient un ل"],"Ex. : الْوَلَدُ جَالِسٌ → « al-waladou »."],["En milieu de phrase, la هَمْزَةُ الْوَصْلِ…","",["Ne se prononce pas","Se prononce","Prend un tanwin"],"Ex. : هَذَا الْبَابُ → « hâdhâ l-bâbou »."],["En milieu de phrase, devant une lettre solaire…","",["Ni la hamza ni le ل ne se prononcent","Seule la hamza se prononce","La hamza et le ل se prononcent"],"Ex. : هَذَا الرَّجُلُ → « hâdhâ r-rajoulou »."]]}],"ordS":[["Le garçon est assis et le professeur est debout.",["الْوَلَدُ","جَالِسٌ","وَالْمُدَرِّسُ","وَاقِفٌ"],"الْوَلَدٌ"],["La pierre est lourde et la feuille est légère.",["الْحَجَرُ","ثَقِيلٌ","وَالْوَرَقُ","خَفِيفٌ"]],["Cette porte est ouverte.",["هَذَا","الْبَابُ","مَفْتُوحٌ"],"الْبَابٌ"],["Le médecin est grand et le malade est petit.",["الطَّبِيبُ","طَوِيلٌ","وَالْمَرِيضُ","قَصِيرٌ"]],["La maison est proche et la mosquée est loin.",["الْبَيْتُ","قَرِيبٌ","وَالْمَسْجِدُ","بَعِيدٌ"]]],"freeN":20,"xFrom":15},{"id":"l4","n":4,"sub":"الإِعْرَابُ ، حُرُوفُ الْجَرِّ","min":{"c":16,"b":8,"e":7,"x":24},"ex":{"v":5,"g":15},"fin":{"v":4,"g":9},"decks":[{"id":"l4v","title":"Vocabulaire","unit":"mots","min":6,"items":[["فِي","Dans","Prépositions","Ex. : فِي الْبَيْتِ"],["عَلَى","Sur","Prépositions","Ex. : عَلَى الْمَكْتَبِ"],["إِلَى","Vers","Prépositions","Ex. : إِلَى الْمَسْجِدِ"],["مِنْ","De (provenance)","Prépositions","≠ مَنْ : qui ?"],["أَيْنَ","Où ?","Questions et pronoms","مِنْ أَيْنَ = d’où ?"],["هُوَ","Il","Questions et pronoms"],["هِيَ","Elle","Questions et pronoms"],["أَنَا","Je / moi","Questions et pronoms","Vu dans les textes"],["أَنْتَ","Tu / toi (masculin)","Questions et pronoms","Vu dans les textes"],["ذَهَبَ","Il est allé","Verbes au passé"],["خَرَجَ","Il est sorti","Verbes au passé"],["جَامِعَةٌ","Université","Lieux"],["مَدْرَسَةٌ","École","Lieux","≠ مُدَرِّسٌ : professeur"],["فَصْلٌ","Classe","Lieux"],["سُوقٌ","Marché","Lieux"],["غُرْفَةٌ","Chambre / pièce","Lieux","Le livre dit aussi : bureau"],["مَطْبَخٌ","Cuisine","Lieux"],["مِرْحَاضٌ","Toilettes","Lieux"],["حَمَّامٌ","Salle de bain","Lieux","Vu dans les textes"],["الصِّينُ","La Chine","Pays"],["الْهِنْدُ","L’Inde","Pays"],["الْيَابَانُ","Le Japon","Pays"],["الْفِلِبِّينُ","Les Philippines","Pays"],["سَمَاءٌ","Ciel","Divers"],["سَاعَةٌ","Heure / montre","Divers"],["مُدِيرٌ","Directeur","Divers"]],"kind":"v"},{"id":"l4t","title":"Termes de grammaire","unit":"termes","min":7,"items":[["مَرْفُوعٌ","Situation marquée par la damma","Les 3 situations","Ex. : مُحَمَّدٌ , الْبَيْتُ"],["مَجْرُورٌ","Situation marquée par la kasra","Les 3 situations","Ex. : فِي الْبَيْتِ"],["مَنْصُوبٌ","Situation marquée par la fatha","Les 3 situations","Ex. : مُحَمَّدًا , الْبَيْتَ"],["الضَّمَّةُ","La damma (ـُ)","Les signes"],["الْكَسْرَةُ","La kasra (ـِ)","Les signes"],["الْفَتْحَةُ","La fatha (ـَ)","Les signes"],["الْعَلَامَةُ","Le signe de la situation grammaticale","Les signes"],["الْإِعْرَابُ","L’analyse grammaticale","Analyse"],["الِاسْمُ الْمُعْرَبُ","Le nom variable","Analyse","Sa fin change selon la situation"],["إِعْرَابُ الِاسْمِ الْمُعْرَبِ","L’analyse du nom variable","Analyse"],["مَبْنِيٌّ","Invariable","Analyse","Ex. : les particules"],["الْفَاعِلُ","Le sujet (fait l’action)","Analyse","Toujours مَرْفُوعٌ"],["الْمَفْعُولُ بِهِ","Le COD (subit l’action)","Analyse","Toujours مَنْصُوبٌ"],["حَرْفُ جَرٍّ","Particule qui rend le nom suivant majrour","Particules","فِي , عَلَى , إِلَى , مِنْ"],["الْجَارُّ وَالْمَجْرُورُ","La particule et son nom majrour","Particules","Ex. : فِي الْبَيْتِ"],["الْتِقَاءُ السَّاكِنَيْنِ","Rencontre de deux soukoun","Particules","مِنْ + الْبَيْتِ → مِنَ الْبَيْتِ"],["الْمَمْنُوعُ مِنَ الصَّرْفِ","Nom sans tanwin, majrour avec fatha","Noms et pronoms","Ex. : مِنْ فَاطِمَةَ"],["الْعَلَمُ الْمُذَكَّرُ","Le nom propre masculin","Noms et pronoms","Ex. : مُحَمَّدٌ"],["الْعَلَمُ الْمُؤَنَّثُ","Le nom propre féminin","Noms et pronoms","Ex. : فَاطِمَةُ"],["الضَّمِيرُ","Le pronom personnel","Noms et pronoms","Ex. : هُوَ , هِيَ"],["الْمَاضِي","Le passé","Noms et pronoms","Ex. : ذَهَبَ"],["الْعَوَامِلُ","Les facteurs qui changent la fin des mots","Analyse"],["مَجْزُومٌ","Situation du verbe marquée par le soukoun (niveau 2)","Les 3 situations"],["الْمُبْتَدَأُ","Le sujet de la phrase nominale","Analyse"],["الْخَبَرُ","L’attribut","Analyse"],["النَّعْتُ","L’adjectif","Analyse"]],"kind":"t"}],"cours":[["h","1. الإِعْرَابُ : la situation grammaticale"],["term","الإِعْرَابُ","al-i‘râb","L’analyse grammaticale, la situation grammaticale du mot","Le changement de la fin des mots selon les facteurs qui agissent sur eux."],["p","**Sens linguistique** (فِي اللُّغَةِ, fi l-lougha) : التَّبْيِينُ وَالْإِيضَاحُ (at-tabyînou wa l-îḍâḥ), l’éclaircissement et l’explication. On dit : أَعْرَبَ فُلَانٌ عَمَّا فِي نَفْسِهِ, « untel a clairement exprimé ce qu’il ressent »."],["p","**Chez les grammairiens** (فِي اصْطِلَاحِ النُّحَاةِ, fi ṣṭilâḥi n-nouḥât) : تَغْيِيرُ أَوَاخِرِ الْكَلِمَاتِ بِسَبَبِ اخْتِلَافِ الْعَوَامِلِ الدَّاخِلَةِ عَلَيْهَا, le changement de la fin des mots à cause des différents facteurs, **الْعَوَامِلُ** (al-‘awâmil), qui agissent sur eux : un verbe, une particule, ou encore le sens voulu."],["ex","بَيْتٌ / بَيْتٍ / بَيْتًا","Un même mot peut finir de trois façons : baytoun, baytin, baytan. Pourquoi ? Parce que la fin dépend de la situation grammaticale dans laquelle se trouve le mot."],["li",["En arabe littéraire, la situation grammaticale de chaque mot **s’entend à l’oral** : celui qui parle fait une analyse grammaticale permanente, en direct.","Les fautes de grammaire s’entendent, et une erreur d’analyse **peut changer le sens** de la phrase.","L’i‘râb est la preuve de la maîtrise de la grammaire."]],["h","2. La situation et son signe"],["p","Une personne exprime ses sentiments par son visage : la tristesse par les larmes, la joie par le sourire, l’étonnement par les yeux écarquillés. Les larmes ne sont que le **signe extérieur** du sentiment. En grammaire, c’est pareil : la situation est le « sentiment » du mot, et la voyelle finale son « expression »."],["term","الْعَلَامَةُ","al-‘alâma","Le signe","La marque visible en fin de mot qui exprime la situation grammaticale."],["t",[["Situation (l’état)","Prononciation","Signe (l’expression)","Prononciation","Son"],["مَرْفُوعٌ","marfoû‘oun","الضَّمَّةُ ـُ","aḍ-ḍamma","ou"],["مَجْرُورٌ","majroûroun","الْكَسْرَةُ ـِ","al-kasra","i"],["مَنْصُوبٌ","manṣoûboun","الْفَتْحَةُ ـَ","al-fatḥa","a"]]],["ex","الْبَيْتُ ، مُحَمَّدٌ","مَرْفُوعٌ s’exprime par الضَّمَّةُ : une damma avec الـ, le tanwin ـٌ sans الـ."],["ex","الْبَيْتِ ، مُحَمَّدٍ","مَجْرُورٌ s’exprime par الْكَسْرَةُ : une kasra avec الـ, le tanwin ـٍ sans الـ."],["ex","الْبَيْتَ ، مُحَمَّدًا","مَنْصُوبٌ s’exprime par الْفَتْحَةُ : une fatha avec الـ, le tanwin ـً sans الـ."],["tip","À retenir : la situation, c’est l’état du mot ; le signe, c’est sa manifestation visible. On ne confond jamais les deux."],["h","3. Qui décide de la situation ?"],["term","الْفَاعِلُ","al-fâ‘il","Celui qui fait l’action (le sujet du verbe)","Il est toujours مَرْفُوعٌ."],["term","الْمَفْعُولُ بِهِ","al-maf‘oûlou bihi","Celui qui subit l’action du verbe (le COD)","Il est toujours مَنْصُوبٌ."],["p","Et le nom qui vient après un **حَرْفُ جَرٍّ** (ḥarfou jarrin) est toujours مَجْرُورٌ (voir partie 5)."],["t",[["Phrase","Mot","Rôle","Situation","Fin"],["Le chat mange la souris.","le chat","il fait l’action","مَرْفُوعٌ","ou"],["Le chat mange la souris.","la souris","elle subit l’action","مَنْصُوبٌ","a"],["Le chat dort sur le lit.","le lit","après « sur »","مَجْرُورٌ","i"]]],["h","4. Le mot variable et le mot invariable"],["term","الِاسْمُ الْمُعْرَبُ","al-ismou l-mou‘rab","Le nom variable","Nom dont la fin change selon la situation grammaticale. Les 3 situations ne s’expriment par des signes que sur le mot variable (مُعْرَبٌ)."],["term","مَبْنِيٌّ","mabniyyoun","Invariable","Mot dont la fin ne change jamais, quelle que soit sa place dans la phrase. Les particules sont invariables."],["p","Pour certains mots, on dit لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ (lâ maḥalla lahâ mina l-i‘râb) : « ils n’ont pas de situation grammaticale ». Cela signifie qu’ils ne peuvent jamais être مُبْتَدَأٌ (moubtada’, sujet de la phrase nominale), خَبَرٌ (khabar, attribut), فَاعِلٌ (fâ‘il, sujet du verbe) ou نَعْتٌ (na‘t, adjectif)…"],["li",["**Signes de base** : la damma, la fatha et la kasra, simples ou doublées (tanwin) : ـُ ـٌ ـَ ـً ـِ ـٍ.","**Signes secondaires** : ا ، و ، ي … Ils seront découverts au fur et à mesure.","Au niveau 2 : une 4e situation, propre aux verbes, **مَجْزُومٌ** (majzoûm), dont le signe de base est **السُّكُونُ** (as-soukoûn) : لَمْ يَلِدْ وَلَمْ يُولَدْ (lam yalid wa lam yoûlad)."]],["h","5. Les particules qui rendent le nom مَجْرُورٌ : حُرُوفُ الْجَرِّ"],["term","حَرْفُ جَرٍّ","ḥarfou jarrin","Particule qui rend مَجْرُورٌ le mot qui la suit","Jusqu’ici, tous les noms finissaient en ـُ ou ـٌ (مَرْفُوعٌ). Désormais, un élément extérieur au mot, la particule, va le faire passer en situation مَجْرُورٌ."],["ex","مُحَمَّدٌ فِي الْبَيْتِ . مُحَمَّدٌ فِي بَيْتٍ","Mohammed est dans la maison. Mohammed est dans une maison : الْبَيْتُ devient الْبَيْتِ, et بَيْتٌ devient بَيْتٍ."],["t",[["Particule","Prononciation","Sens","Exemple"],["فِي","fî","dans","فِي الْبَيْتِ"],["عَلَى","‘alâ","sur","عَلَى الْمَكْتَبِ"],["إِلَى","ilâ","vers","إِلَى الْمَسْجِدِ"],["مِنْ","min","de (provenance)","مِنَ الْبَيْتِ"]]],["li",["Elles servent à dire : depuis, vers, dans, sur…","Particularité 1 : elles sont **invariables** (مَبْنِيٌّ).","Particularité 2 : elles n’ont **pas de situation grammaticale** (لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ).","La particule et son nom forment **الْجَارُّ وَالْمَجْرُورُ** (al-jârrou wa l-majroûr) : الْجَارُّ, celle qui rend مَجْرُورٌ ; الْمَجْرُورُ, le nom qu’elle rend مَجْرُورٌ."]],["ex","الْبَيْتُ : فِي الْبَيْتِ . الْمَسْجِدُ : فِي الْمَسْجِدِ","Observe : la damma devient kasra après فِي."],["ex","الْمَكْتَبُ : عَلَى الْمَكْتَبِ . السَّرِيرُ : عَلَى السَّرِيرِ","Même changement après عَلَى."],["h","6. مِنَ الْبَيْتِ : la rencontre de deux soukoun"],["term","الْتِقَاءُ السَّاكِنَيْنِ","iltiqâ’ou s-sâkinayn","La rencontre de deux soukoun","Lorsque deux soukoun se suivent, la langue arabe en supprime toujours un, en mettant une voyelle sur le premier."],["t",[["Premier mot","Voyelle ajoutée","Exemple","Prononciation"],["Une particule (حَرْفٌ)","fatha","مِنَ الْبَيْتِ","mina l-bayti"],["Un nom (اِسْمٌ)","damma","عَلَيْكُمُ السَّلَامُ","‘alaykoumou s-salâm"],["Un verbe (فِعْلٌ)","kasra","قَدْ قَامَتِ الصَّلَاةُ","qad qâmati ṣ-ṣalâh"]]],["p","C’est pourquoi on dit مِنَ الْبَيْتِ (mina) mais مِنْ بَيْتٍ (min) : sans الـ, il n’y a pas de second soukoun."],["h","7. Le nom qui refuse le tanwin : الْمَمْنُوعُ مِنَ الصَّرْفِ"],["term","الْمَمْنُوعُ مِنَ الصَّرْفِ","al-mamnoû‘ou mina ṣ-ṣarf","Le nom privé du tanwin, dont le signe du مَجْرُورٌ est la fatha","C’est un اِسْمٌ qui refuse deux éléments : ❶ le tanwin (لَا يُنَوَّنُ, lâ younawwan) ; ❷ la kasra (عَلَامَةُ جَرِّهِ الْفَتْحَةُ, ‘alâmatou jarrihi l-fatḥa : le signe de son jarr est la fatha)."],["t",[["Situation","Signe","Exemple","Prononciation"],["مَرْفُوعٌ","une seule damma ـُ","فَاطِمَةُ","fâṭimatou"],["مَنْصُوبٌ","une seule fatha ـَ","فَاطِمَةَ","fâṭimata"],["مَجْرُورٌ","une seule fatha ـَ (jamais de kasra)","مِنْ فَاطِمَةَ","min fâṭimata"]]],["tip","Ne pas confondre : il refuse **la kasra**, pas **la situation** مَجْرُورٌ. Après مِنْ, فَاطِمَةَ est bien مَجْرُورٌ : elle exprime simplement son jarr par une fatha."],["p","Le niveau 1 en présente 10 sortes. La première : **الْعَلَمُ الْمُؤَنَّثُ** (al-‘alamou l-mou’annath), le prénom féminin : زَيْنَبُ ، آمِنَةُ ، فَاطِمَةُ ، مَرْيَمُ ، عَائِشَةُ ، صَفِيَّةُ ، خَدِيجَةُ ، رُقَيَّةُ."],["p","À l’inverse, **الْعَلَمُ الْمُذَكَّرُ** (al-‘alamou l-moudhakkar), le prénom masculin, prend le tanwin et la kasra : مُحَمَّدٌ ، خَالِدٌ ، حَامِدٌ ، يَاسِرٌ ، عَمَّارٌ ، سَعِيدٌ ، عَلِيٌّ ، عَبَّاسٌ."],["t",[["Situation","Prénom féminin","Prénom masculin"],["مَرْفُوعٌ","فَاطِمَةُ","مُحَمَّدٌ"],["مَنْصُوبٌ","فَاطِمَةَ","مُحَمَّدًا"],["مَجْرُورٌ","مِنْ فَاطِمَةَ","مِنْ مُحَمَّدٍ"]]],["h","8. Tableau récapitulatif : إِعْرَابُ الِاسْمِ الْمُعْرَبِ"],["p","Tu connais maintenant les 3 situations, leurs signes, les حُرُوفُ الْجَرِّ et l’exception du مَمْنُوعٌ مِنَ الصَّرْفِ. Voici le tableau de la page 40, à savoir par cœur : l’analyse grammaticale du nom variable, **إِعْرَابُ الِاسْمِ الْمُعْرَبِ** (i‘râbou l-ismi l-mou‘rab)."],["p","Type de mot : **اِسْمٌ مُعْرَبٌ** (ismoun mou‘rab), le nom variable."],["t",[["Situation","Prononciation","وَعَلَامَةُ","Le signe"],["مَرْفُوعٌ","marfoû‘oun","رَفْعِهِ","الضَّمَّةُ"],["مَجْرُورٌ","majroûroun","جَرِّهِ","الْكَسْرَةُ"],["مَنْصُوبٌ","manṣoûboun","نَصْبِهِ","الْفَتْحَةُ"]]],["li",["رَفْعٌ (raf‘), جَرٌّ (jarr) et نَصْبٌ (naṣb) sont les noms des 3 situations.","رَفْعِهِ (raf‘ihi) = « de son raf‘ » ; عَلَامَةٌ (‘alâma) = signe. وَعَلَامَةُ رَفْعِهِ = « et le signe de son raf‘ est… »."]],["h","Les formules d’analyse à savoir par cœur"],["ex","مُحَمَّدٌ : اِسْمٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ","« ismoun marfoû‘oun wa ‘alâmatou raf‘ihi ḍ-ḍamma » : nom marfoû‘, et le signe de son raf‘ est la damma."],["ex","مُحَمَّدٍ : اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ","« ismoun majroûroun wa ‘alâmatou jarrihi l-kasra » : nom majroûr, et le signe de son jarr est la kasra."],["ex","مُحَمَّدًا : اِسْمٌ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ","« ismoun manṣoûboun wa ‘alâmatou naṣbihi l-fatḥa » : nom manṣoûb, et le signe de son naṣb est la fatha."],["ex","فَاطِمَةَ : اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْفَتْحَةُ لِأَنَّهُ مَمْنُوعٌ مِنَ الصَّرْفِ","Cas du مَمْنُوعٌ مِنَ الصَّرْفِ (après مِنْ) : « … wa ‘alâmatou jarrihi l-fatḥatou li-annahou mamnoû‘oun mina ṣ-ṣarf » : majroûr, mais son signe est la fatha car il refuse la kasra."],["h","Méthode : analyser un nom en 3 questions"],["li",["1. Juste avant le nom, y a-t-il فِي ، عَلَى ، إِلَى ou مِنْ ? → مَجْرُورٌ (i, ou a pour un prénom féminin).","2. Sinon, le nom subit-il l’action d’un verbe (on fait l’action **à quoi, à qui ?**) → مَنْصُوبٌ (a).","3. Sinon → مَرْفُوعٌ (ou)."]],["ex","ذَهَبْتُ إِلَى عَائِشَةَ","عَائِشَةَ : après إِلَى → مَجْرُورٌ ; prénom féminin → signe : la fatha. اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْفَتْحَةُ لِأَنَّهُ مَمْنُوعٌ مِنَ الصَّرْفِ."],["h","9. Les textes : où ? d’où ?"],["ex","أَيْنَ مُحَمَّدٌ ؟ هُوَ فِي الْغُرْفَةِ","Où est Mohammed ? Il est dans la chambre."],["ex","أَيْنَ آمِنَةُ ؟ هِيَ فِي الْمَطْبَخِ","Où est Amina ? Elle est dans la cuisine : آمِنَةُ, prénom féminin, n’a pas de tanwin."],["ex","مِنْ أَيْنَ أَنْتَ ؟ أَنَا مِنَ الْيَابَانِ","D’où es-tu ? Je viens du Japon."],["ex","أَيْنَ ذَهَبَ ؟ ذَهَبَ إِلَى الْمُدِيرِ","Où est-il allé ? Il est allé chez le directeur."],["li",["أَيْنَ (ayna) = où ? ; مِنْ أَيْنَ (min ayna) = d’où ?","هُوَ (houwa) = il, هِيَ (hiya) = elle : ce sont des pronoms personnels, **الضَّمِيرُ** (aḍ-ḍamîr).","ذَهَبَ (dhahaba, il est allé) et خَرَجَ (kharaja, il est sorti) sont au passé, **الْمَاضِي** (al-mâḍî)."]],["h","Fiche de synthèse : vocabulaire grammatical"],["t",[["Arabe","Prononciation","Sens"],["الإِعْرَابُ","al-i‘râb","L’analyse grammaticale"],["الْعَوَامِلُ","al-‘awâmil","Les facteurs qui changent la fin des mots"],["الْعَلَامَةُ","al-‘alâma","Le signe de la situation"],["مَرْفُوعٌ","marfoû‘","Situation marquée par la damma"],["مَجْرُورٌ","majroûr","Situation marquée par la kasra"],["مَنْصُوبٌ","manṣoûb","Situation marquée par la fatha"],["مَجْزُومٌ","majzoûm","Situation du verbe marquée par le soukoun (niveau 2)"],["الِاسْمُ الْمُعْرَبُ","al-ismou l-mou‘rab","Le nom variable"],["مَبْنِيٌّ","mabniyy","Invariable"],["الْفَاعِلُ","al-fâ‘il","Celui qui fait l’action"],["الْمَفْعُولُ بِهِ","al-maf‘oûlou bihi","Celui qui subit l’action (COD)"],["حَرْفُ جَرٍّ","ḥarfou jarr","Particule qui rend le nom مَجْرُورٌ"],["الْجَارُّ وَالْمَجْرُورُ","al-jârrou wa l-majroûr","La particule et son nom مَجْرُورٌ"],["الْتِقَاءُ السَّاكِنَيْنِ","iltiqâ’ou s-sâkinayn","La rencontre de deux soukoun"],["الْمَمْنُوعُ مِنَ الصَّرْفِ","al-mamnoû‘ou mina ṣ-ṣarf","Le nom sans tanwin, majroûr par la fatha"],["الْعَلَمُ الْمُذَكَّرُ","al-‘alamou l-moudhakkar","Le nom propre masculin"],["الْعَلَمُ الْمُؤَنَّثُ","al-‘alamou l-mou’annath","Le nom propre féminin"],["الضَّمِيرُ","aḍ-ḍamîr","Le pronom personnel"],["الْمَاضِي","al-mâḍî","Le passé"]]]],"stat":[["Les 3 situations","الإِعْرَابُ, c’est…","",["Le changement de la fin des mots selon leur situation","La prononciation de الـ","La traduction d’un mot"],"Chez les grammairiens : le changement des signes en fin de mot."],["Les 3 situations","Au sens linguistique, الإِعْرَابُ signifie…","",["L’éclaircissement, l’explication","La lecture","Le silence"],"أَعْرَبَ فُلَانٌ عَمَّا فِي نَفْسِهِ : il a clairement exprimé ce qu’il ressent."],["Les 3 situations","Combien de situations pour le nom au niveau 1 ?","",["3","2","4"],"مَرْفُوعٌ ، مَجْرُورٌ ، مَنْصُوبٌ."],["Les 3 situations","مَرْفُوعٌ s’exprime par…","",["La damma ـُ","La kasra ـِ","La fatha ـَ"],"Ex. : الْبَيْتُ."],["Les 3 situations","مَجْرُورٌ s’exprime par…","",["La kasra ـِ","La damma ـُ","La fatha ـَ"],"Ex. : فِي الْبَيْتِ."],["Les 3 situations","مَنْصُوبٌ s’exprime par…","",["La fatha ـَ","La kasra ـِ","La damma ـُ"],"Ex. : مُحَمَّدًا."],["Les 3 situations","La damma est à مَرْفُوعٌ ce que…","",["Le sourire est à la joie","La joie est au sourire","La porte est à la maison"],"La situation = l’émotion ; le signe (الْعَلَامَةُ) = son expression visible."],["Les 3 situations","Celui qui fait l’action (الْفَاعِلُ) est toujours…","",["مَرْفُوعٌ","مَنْصُوبٌ","مَجْرُورٌ"],"Il prend « ou »."],["Les 3 situations","Celui qui subit l’action (الْمَفْعُولُ بِهِ) est toujours…","",["مَنْصُوبٌ","مَرْفُوعٌ","مَجْرُورٌ"],"Il prend « a »."],["حُرُوفُ الْجَرِّ","Le nom après un حَرْفُ جَرٍّ est toujours…","",["مَجْرُورٌ","مَرْفُوعٌ","مَنْصُوبٌ"],"Il prend « i »."],["حُرُوفُ الْجَرِّ","Les حُرُوفُ الْجَرِّ sont…","",["Invariables (مَبْنِيَّةٌ)","Variables (مُعْرَبَةٌ)","Toujours مَرْفُوعَةٌ"],"Leur fin ne change jamais."],["حُرُوفُ الْجَرِّ","Un حَرْفُ جَرٍّ peut-il être sujet (فَاعِلٌ) ?","",["Non, il n’a pas de situation grammaticale","Oui, en début de phrase","Oui, avec une damma"],"Il ne peut être ni مُبْتَدَأٌ, ni خَبَرٌ, ni فَاعِلٌ, ni نَعْتٌ."],["Les 3 situations","Quels mots changent de fin selon la situation ?","",["Le nom variable (الِاسْمُ الْمُعْرَبُ)","Les particules","Tous les mots"],"Les particules sont invariables."],["حُرُوفُ الْجَرِّ","Particule + nom devenu مَجْرُورٌ s’appelle :","",["الْجَارُّ وَالْمَجْرُورُ","الْمَمْنُوعُ مِنَ الصَّرْفِ","الْتِقَاءُ السَّاكِنَيْنِ"],"Ex. : فِي الْبَيْتِ."],["مَمْنُوعٌ مِنَ الصَّرْفِ","الْمَمْنُوعُ مِنَ الصَّرْفِ refuse…","",["Le tanwin et la kasra","Le tanwin et la damma","La fatha et la kasra"],"Ex. : فَاطِمَةُ (jamais فَاطِمَةٌ)."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Un مَمْنُوعٌ مِنَ الصَّرْفِ en situation مَجْرُورٌ prend…","",["Une fatha","Une kasra","Un tanwin"],"مِنْ فَاطِمَةَ."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Refuser la kasra, c’est…","",["Différent de refuser la situation مَجْرُورٌ","Pareil que refuser مَجْرُورٌ","Refuser الـ"],"Le nom est bien مَجْرُورٌ, mais l’exprime par une fatha."],["مَمْنُوعٌ مِنَ الصَّرْفِ","1re sorte de مَمْنُوعٌ مِنَ الصَّرْفِ étudiée :","",["Les prénoms féminins (الْعَلَمُ الْمُؤَنَّثُ)","Les prénoms masculins","Les noms de pays"],"زَيْنَبُ ، فَاطِمَةُ ، مَرْيَمُ…"],["Deux soukoun","Ces deux mots se suivent. Résultat :","مِنْ + الْبَيْتِ",["مِنَ الْبَيْتِ","مِنِ الْبَيْتِ","مِنُ الْبَيْتِ"],"Deux soukoun : particule → fatha."],["Deux soukoun","Ces deux mots se suivent. Résultat :","عَلَيْكُمْ + السَّلَامُ",["عَلَيْكُمُ السَّلَامُ","عَلَيْكُمَ السَّلَامُ","عَلَيْكُمِ السَّلَامُ"],"Deux soukoun : nom → damma."],["Deux soukoun","Ces deux mots se suivent. Résultat :","قَامَتْ + الصَّلَاةُ",["قَامَتِ الصَّلَاةُ","قَامَتَ الصَّلَاةُ","قَامَتُ الصَّلَاةُ"],"Deux soukoun : verbe → kasra."],["Où ? D’où ? (هُوَ / هِيَ)","« D’où es-tu ? » (Japon)","مِنْ أَيْنَ أَنْتَ ؟",["أَنَا مِنَ الْيَابَانِ","أَنَا مِنْ الْيَابَانُ","هُوَ مِنَ الْيَابَانِ"],"أَنَا = je ; مِنَ + nom مَجْرُورٌ."],["حُرُوفُ الْجَرِّ","« Mohammed est allé à la mosquée. »","",["ذَهَبَ مُحَمَّدٌ إِلَى الْمَسْجِدِ","ذَهَبَ مُحَمَّدًا إِلَى الْمَسْجِدِ","ذَهَبَ مُحَمَّدٌ إِلَى الْمَسْجِدُ"],"Mohammed fait l’action → ou ; après إِلَى → i."],["Les 3 situations","4e situation (niveau 2), propre aux verbes :","",["مَجْزُومٌ, avec un soukoun","مَنْصُوبٌ, avec une fatha","مَرْفُوعٌ, avec une damma"],"Ex. : لَمْ يَلِدْ."],["Les 3 situations","Les signes ا ، و ، ي sont des signes…","",["Secondaires (vus plus tard)","De base","Interdits"],"Les signes de base sont ـُ ـٌ ـَ ـً ـِ ـٍ."],["Où ? D’où ? (هُوَ / هِيَ)","هُوَ et هِيَ sont des…","",["Pronoms personnels (الضَّمِيرُ)","Verbes au passé","Particules"],"هُوَ = il, هِيَ = elle."],["Termes L4","ذَهَبَ et خَرَجَ sont au…","",["Passé (الْمَاضِي)","Présent","Futur"],"ذَهَبَ = il est allé ; خَرَجَ = il est sorti."],["Termes L4","Terme pour « nom propre masculin » :","",["الْعَلَمُ الْمُذَكَّرُ","الْعَلَمُ الْمُؤَنَّثُ","الضَّمِيرُ"],"Ex. : مُحَمَّدٌ."],["Les 3 situations","Vrai ou faux ? الإِعْرَابُ est le changement de la fin des mots selon les facteurs qui agissent sur eux.","",["Vrai","Faux"],"Vrai : تَغْيِيرُ أَوَاخِرِ الْكَلِمَاتِ بِسَبَبِ اخْتِلَافِ الْعَوَامِلِ الدَّاخِلَةِ عَلَيْهَا (définition des grammairiens)."],["Les 3 situations","Quelle est la différence entre مَرْفُوعٌ et الضَّمَّةُ ?","",["مَرْفُوعٌ est la situation, الضَّمَّةُ est son signe visible","Ce sont deux noms de la même voyelle","الضَّمَّةُ est la situation, مَرْفُوعٌ son signe"],"Comme la tristesse (le sentiment) s’exprime par les larmes (le signe), مَرْفُوعٌ (la situation) s’exprime par الضَّمَّةُ (الْعَلَامَةُ)."],["Les 3 situations","Le signe de base de la situation مَجْرُورٌ est…","",["الْكَسْرَةُ","الضَّمَّةُ","الْفَتْحَةُ"],"مَجْرُورٌ → الْكَسْرَةُ (ـِ ou ـٍ) : فِي الْبَيْتِ."],["Les 3 situations","Le signe de base de la situation مَنْصُوبٌ est…","",["الْفَتْحَةُ","الْكَسْرَةُ","السُّكُونُ"],"مَنْصُوبٌ → الْفَتْحَةُ (ـَ ou ـً) : مُحَمَّدًا."],["Les 3 situations","Vrai ou faux ? الْفَاعِلُ (celui qui fait l’action) est toujours مَنْصُوبٌ.","",["Faux","Vrai"],"Faux : الْفَاعِلُ est toujours مَرْفُوعٌ ; c’est الْمَفْعُولُ بِهِ (le COD) qui est toujours مَنْصُوبٌ."],["Les 3 situations","Dans « le chat mange la souris », quelle est la situation de « la souris » ?","",["مَنْصُوبٌ (a) : elle subit l’action","مَرْفُوعٌ (ou) : elle fait l’action","مَجْرُورٌ (i) : elle suit une particule"],"La souris subit l’action : c’est الْمَفْعُولُ بِهِ, toujours مَنْصُوبٌ."],["Les 3 situations","Que signifie مَبْنِيٌّ (mabniyy) ?","",["Invariable : sa fin ne change jamais","Variable : sa fin change","Défini par الـ"],"Le mot مَبْنِيٌّ garde toujours la même fin. Le nom variable se dit الِاسْمُ الْمُعْرَبُ."],["Les 3 situations","Au niveau 2, une 4e situation propre aux verbes sera étudiée. Laquelle ?","لَمْ يَلِدْ وَلَمْ يُولَدْ",["مَجْزُومٌ, avec le soukoun pour signe","مَنْصُوبٌ, avec la fatha pour signe","مَبْنِيٌّ, avec la chadda pour signe"],"Le verbe مَجْزُومٌ (majzoûm) a pour signe de base السُّكُونُ (le soukoun) : لَمْ يَلِدْ."],["Les 3 situations","Cas pratique : quelle est la situation de chaque nom ?","ذَهَبَ مُحَمَّدٌ إِلَى الْمُدِيرِ",["مُحَمَّدٌ : مَرْفُوعٌ ; الْمُدِيرِ : مَجْرُورٌ","مُحَمَّدٌ : مَجْرُورٌ ; الْمُدِيرِ : مَرْفُوعٌ","Les deux sont مَنْصُوبٌ"],"مُحَمَّدٌ fait l’action (الْفَاعِلُ) → مَرْفُوعٌ ; الْمُدِيرِ vient après إِلَى → مَجْرُورٌ."],["Les 3 situations","Analyse (إِعْرَاب) du mot مُحَمَّدٌ :","مُحَمَّدٌ فِي الْبَيْتِ",["اِسْمٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ","اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ","اِسْمٌ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ"],"Aucune particule avant lui, aucune action subie : مَرْفُوعٌ, signe الضَّمَّةُ (ismoun marfoû‘oun wa ‘alâmatou raf‘ihi ḍ-ḍamma)."],["Les 3 situations","Analyse (إِعْرَاب) du mot مُحَمَّدًا :","رَأَيْتُ مُحَمَّدًا",["اِسْمٌ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ","اِسْمٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ","اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ"],"مُحَمَّدًا subit l’action de voir (الْمَفْعُولُ بِهِ) : مَنْصُوبٌ, signe الْفَتْحَةُ (ismoun manṣoûboun wa ‘alâmatou naṣbihi l-fatḥa)."],["Les 3 situations","Complète la formule d’analyse :","اِسْمٌ مَجْرُورٌ وَعَلَامَةُ …… الْكَسْرَةُ",["جَرِّهِ","رَفْعِهِ","نَصْبِهِ"],"Situation مَجْرُورٌ → جَرٌّ (jarr) : وَعَلَامَةُ جَرِّهِ, « et le signe de son jarr »."],["Les 3 situations","Complète la formule d’analyse :","اِسْمٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ ……",["الضَّمَّةُ","الْفَتْحَةُ","الْكَسْرَةُ"],"Le signe de base du رَفْعٌ (raf‘) est الضَّمَّةُ."],["Termes L4","Que signifie الْعَلَامَةُ (al-‘alâma) ?","",["Le signe qui exprime la situation grammaticale","L’analyse grammaticale","Le nom variable"],"الْعَلَامَةُ = le signe visible en fin de mot (damma, kasra, fatha…)."],["حُرُوفُ الْجَرِّ","Vrai ou faux ? Les حُرُوفُ الْجَرِّ peuvent être sujet de la phrase.","",["Faux","Vrai"],"Faux : ils sont invariables (مَبْنِيٌّ) et n’ont pas de situation grammaticale (لَا مَحَلَّ لَهَا مِنَ الإِعْرَابِ)."],["حُرُوفُ الْجَرِّ","Choisis la bonne fin :","الْقَلَمُ عَلَى ……",["الْمَكْتَبِ","الْمَكْتَبُ","الْمَكْتَبٍ"],"Après عَلَى, le nom est مَجْرُورٌ : kasra. Avec الـ, jamais de tanwin."],["حُرُوفُ الْجَرِّ","Complète avec la bonne particule :","الطَّالِبُ …… الْجَامِعَةِ",["فِي","عَلَى","إِلَى"],"L’étudiant est dans l’université : فِي (dans)."],["حُرُوفُ الْجَرِّ","Complète avec la bonne particule :","ذَهَبَ حَامِدٌ …… الْجَامِعَةِ",["إِلَى","فِي","عَلَى"],"Avec ذَهَبَ (il est allé), on indique la direction : إِلَى (vers)."],["حُرُوفُ الْجَرِّ","Que désigne الْجَارُّ وَالْمَجْرُورُ ?","فِي الْبَيْتِ",["La particule et le nom qu’elle rend مَجْرُورٌ","Le sujet et le verbe","Le nom et son adjectif"],"فِي = الْجَارُّ (celle qui rend مَجْرُورٌ), الْبَيْتِ = الْمَجْرُورُ."],["حُرُوفُ الْجَرِّ","Analyse (إِعْرَاب) du mot الْبَيْتِ :","مُحَمَّدٌ فِي الْبَيْتِ",["اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ","اِسْمٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ","اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْفَتْحَةُ"],"Après فِي (حَرْفُ جَرٍّ) : مَجْرُورٌ, signe الْكَسْرَةُ (ismoun majroûroun wa ‘alâmatou jarrihi l-kasra)."],["Deux soukoun","Pourquoi dit-on مِنَ الْبَيْتِ et non مِنْ الْبَيْتِ ?","مِنَ الْبَيْتِ",["Pour éviter deux soukoun qui se suivent","Parce que الْبَيْتِ est féminin","Parce que مِنْ devient un verbe"],"الْتِقَاءُ السَّاكِنَيْنِ : le soukoun de مِنْ rencontre celui du ل. Le premier mot étant un حَرْفٌ, il prend une fatha."],["Deux soukoun","Pourquoi une kasra sur قَامَتِ ?","قَدْ قَامَتِ الصَّلَاةُ",["Le premier mot est un verbe : il prend une kasra","Le premier mot est un nom : il prend une kasra","C’est la situation مَجْرُورٌ"],"Rencontre de deux soukoun : verbe → kasra ; nom → damma ; particule → fatha."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Vrai ou faux ? Le مَمْنُوعٌ مِنَ الصَّرْفِ refuse la situation مَجْرُورٌ.","",["Faux","Vrai"],"Faux : il refuse la kasra (et le tanwin), pas la situation. Il peut être مَجْرُورٌ, mais l’exprime par une fatha."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Quels sont les deux éléments que refuse le مَمْنُوعٌ مِنَ الصَّرْفِ ?","",["Le tanwin et la kasra","La damma et la fatha","L’article الـ et le tanwin"],"لَا يُنَوَّنُ (pas de tanwin) et عَلَامَةُ جَرِّهِ الْفَتْحَةُ (son signe de jarr est la fatha)."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Choisis la bonne fin :","ذَهَبْتُ إِلَى ……",["عَائِشَةَ","عَائِشَةِ","عَائِشَةٍ"],"Après إِلَى, عَائِشَةُ est مَجْرُورٌ ; prénom féminin (مَمْنُوعٌ مِنَ الصَّرْفِ) : son jarr s’exprime par une seule fatha."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Analyse (إِعْرَاب) du mot عَائِشَةَ :","ذَهَبْتُ إِلَى عَائِشَةَ",["اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْفَتْحَةُ لِأَنَّهُ مَمْنُوعٌ مِنَ الصَّرْفِ","اِسْمٌ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ","اِسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ"],"Après إِلَى, عَائِشَةَ est مَجْرُورٌ ; prénom féminin, il refuse la kasra : son signe de jarr est la fatha. La fatha ne le rend pas مَنْصُوبٌ !"],["مَمْنُوعٌ مِنَ الصَّرْفِ","Quel prénom prend le tanwin ?","",["خَالِدٌ","زَيْنَبُ","مَرْيَمُ"],"خَالِدٌ est un prénom masculin (الْعَلَمُ الْمُذَكَّرُ) : il prend le tanwin. زَيْنَبُ et مَرْيَمُ sont des prénoms féminins : مَمْنُوعٌ مِنَ الصَّرْفِ."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Choisis la bonne fin :","هَذَا مِنْ ……",["مُحَمَّدٍ","مُحَمَّدَ","مُحَمَّدًا"],"مُحَمَّدٌ est un prénom masculin : après مِنْ, il prend la kasra avec tanwin : مِنْ مُحَمَّدٍ."],["Où ? D’où ? (هُوَ / هِيَ)","Réponds (elle est dans la chambre) :","أَيْنَ زَيْنَبُ ؟",["هِيَ فِي الْغُرْفَةِ","هُوَ فِي الْغُرْفَةِ","هِيَ فِي الْغُرْفَةُ"],"زَيْنَبُ est un prénom féminin → هِيَ ; après فِي → kasra : الْغُرْفَةِ."],["Termes L4","Que signifie الضَّمِيرُ (aḍ-ḍamîr) ?","هُوَ ، هِيَ",["Le pronom personnel","Le passé","Le nom propre"],"هُوَ (il) et هِيَ (elle) sont des pronoms personnels : الضَّمِيرُ."],["حُرُوفُ الْجَرِّ","Complète avec la bonne particule :","الْكِتَابُ …… الْمَكْتَبِ",["عَلَى","إِلَى","مِنْ"],"Le livre est sur le bureau : عَلَى (exercice 4 p. 47)."],["حُرُوفُ الْجَرِّ","Complète avec la bonne particule :","الطَّالِبُ …… الْفَصْلِ",["فِي","عَلَى","إِلَى"],"L’étudiant est dans la classe : فِي (exercice 4 p. 47)."],["حُرُوفُ الْجَرِّ","Complète avec la bonne particule :","خَرَجَ الْمُدِيرُ …… الْمَدْرَسَةِ",["مِنَ","عَلَى","فِي"],"Le directeur est sorti de l’école : مِنْ, qui devient مِنَ devant الـ (deux soukoun)."],["حُرُوفُ الْجَرِّ","Choisis la bonne fin :","الرَّجُلُ فِي ……",["الْمَسْجِدِ","الْمَسْجِدُ","الْمَسْجِدَ"],"Après فِي → مَجْرُورٌ : kasra (exercice 3 p. 47)."],["حُرُوفُ الْجَرِّ","Choisis la bonne fin :","أَيْنَ التَّاجِرُ ؟ هُوَ فِي ……",["الدُّكَّانِ","الدُّكَّانُ","الدُّكَّانَ"],"Après فِي → kasra : الدُّكَّانِ (la boutique)."],["حُرُوفُ الْجَرِّ","Choisis la bonne fin :","الشَّمْسُ وَالْقَمَرُ فِي ……",["السَّمَاءِ","السَّمَاءُ","السَّمَاءَ"],"Après فِي → kasra : السَّمَاءِ, le ciel (exercice 3 p. 42)."],["حُرُوفُ الْجَرِّ","Choisis la bonne fin :","ذَهَبَ عَلِيٌّ إِلَى ……",["الْمِرْحَاضِ","الْمِرْحَاضُ","الْمِرْحَاضَ"],"Après إِلَى → kasra (texte b p. 45)."],["حُرُوفُ الْجَرِّ","Choisis la bonne fin (sans الـ) :","مُحَمَّدٌ فِي ……",["بَيْتٍ","بَيْتٌ","بَيْتًا"],"Sans الـ, la kasra devient tanwin : بَيْتٍ (baytin)."],["حُرُوفُ الْجَرِّ","Vrai ou faux ? Les حُرُوفُ الْجَرِّ sont invariables.","فِي ، عَلَى ، إِلَى ، مِنْ",["Vrai","Faux"],"Vrai : ils sont مَبْنِيٌّ, leur fin ne change jamais."],["حُرُوفُ الْجَرِّ","Traduis : « Le stylo est sur le bureau. »","",["الْقَلَمُ عَلَى الْمَكْتَبِ","الْقَلَمُ فِي الْمَكْتَبِ","الْقَلَمِ عَلَى الْمَكْتَبُ"],"عَلَى = sur ; après عَلَى, الْمَكْتَبِ prend la kasra ; الْقَلَمُ garde la damma (exercice 3 p. 47)."],["Où ? D’où ? (هُوَ / هِيَ)","Réponds (il est sur le bureau) :","أَيْنَ الْكِتَابُ ؟",["هُوَ عَلَى الْمَكْتَبِ","هِيَ عَلَى الْمَكْتَبِ","هُوَ عَلَى الْمَكْتَبُ"],"كِتَابٌ est masculin → هُوَ ; après عَلَى → kasra."],["Où ? D’où ? (هُوَ / هِيَ)","Réponds (elle est sur le lit) :","أَيْنَ السَّاعَةُ ؟",["هِيَ عَلَى السَّرِيرِ","هُوَ عَلَى السَّرِيرِ","هِيَ عَلَى السَّرِيرُ"],"سَاعَةٌ finit par ة : féminin → هِيَ (texte a p. 41)."],["Où ? D’où ? (هُوَ / هِيَ)","Réponds (il est dans la salle de bain) :","أَيْنَ يَاسِرٌ ؟",["هُوَ فِي الْحَمَّامِ","هِيَ فِي الْحَمَّامِ","هُوَ فِي الْحَمَّامُ"],"يَاسِرٌ est un prénom masculin → هُوَ ; après فِي → kasra (texte a p. 41)."],["Où ? D’où ? (هُوَ / هِيَ)","Traduis : « D’où es-tu ? Je viens de Chine. »","",["مِنْ أَيْنَ أَنْتَ ؟ أَنَا مِنَ الصِّينِ","أَيْنَ أَنْتَ ؟ أَنَا فِي الصِّينِ","مِنْ أَيْنَ أَنْتَ ؟ أَنَا مِنْ الصِّينُ"],"مِنْ أَيْنَ = d’où ; مِنْ + الـ → مِنَ ; après مِنْ → kasra : الصِّينِ."],["Où ? D’où ? (هُوَ / هِيَ)","Que signifie cette réponse ?","هُوَ مِنَ الْهِنْدِ",["Il vient d’Inde.","Elle vient d’Inde.","Il est allé en Inde."],"هُوَ = il ; مِنَ = de ; الْهِنْدُ = l’Inde (texte b p. 45)."],["Où ? D’où ? (هُوَ / هِيَ)","Que signifie cette réponse ?","ذَهَبَ إِلَى الْمُدِيرِ",["Il est allé chez le directeur.","Il est sorti de chez le directeur.","Il est le directeur."],"ذَهَبَ = il est allé ; إِلَى = vers ; الْمُدِيرُ = le directeur."],["Termes L4","Que signifie خَرَجَ (kharaja) ?","خَرَجَ",["Il est sorti","Il est allé","Il est entré"],"خَرَجَ = il est sorti ; ذَهَبَ = il est allé. Deux verbes au passé (الْمَاضِي)."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Choisis la bonne fin :","أَيْنَ …… ؟ هِيَ فِي الْغُرْفَةِ",["زَيْنَبُ","زَيْنَبٌ","زَيْنَبِ"],"زَيْنَبُ est مَرْفُوعٌ : prénom féminin, une seule damma, sans tanwin."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Choisis la bonne fin :","ذَهَبَ مُحَمَّدٌ إِلَى ……",["خَدِيجَةَ","خَدِيجَةِ","خَدِيجَةٍ"],"Après إِلَى → مَجْرُورٌ ; prénom féminin → une seule fatha (exercice 1 p. 46)."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Choisis la bonne fin :","هَذَا مِنْ ……",["سَعِيدٍ","سَعِيدَ","سَعِيدٌ"],"سَعِيدٌ est un prénom masculin : après مِنْ, il prend la kasra avec tanwin (exercice 1 p. 46)."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Choisis la bonne fin :","هَذَا مِنْ ……",["فَاطِمَةَ","فَاطِمَةِ","فَاطِمَةٌ"],"Prénom féminin مَجْرُورٌ : une seule fatha (exercice 1 p. 46)."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Quel prénom est مَمْنُوعٌ مِنَ الصَّرْفِ ?","",["صَفِيَّةُ","عَمَّارٌ","حَامِدٌ"],"صَفِيَّةُ est un prénom féminin (الْعَلَمُ الْمُؤَنَّثُ) : pas de tanwin. عَمَّارٌ et حَامِدٌ sont masculins."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Vrai ou faux ? رُقَيَّةُ ne prend jamais de tanwin.","رُقَيَّةُ",["Vrai","Faux"],"Vrai : c’est un prénom féminin, donc مَمْنُوعٌ مِنَ الصَّرْفِ : jamais de tanwin, et une fatha à la place de la kasra."],["مَمْنُوعٌ مِنَ الصَّرْفِ","Vrai ou faux ? Au niveau 1, la première sorte de مَمْنُوعٌ مِنَ الصَّرْفِ étudiée est le prénom féminin.","",["Vrai","Faux"],"Vrai : le livre en annonce 10 sortes ; la première est الْعَلَمُ الْمُؤَ  const L=LBY[p[p[0]==="g"?2:1]];if(!L)return null;
 if(p[0]==="s")return L.stat[+p[2]]?statQ(L,+p[2]):null;
 if(p[0]==="b")return L.bookFlat[+p[2]]?bookQ(L,+p[2]):null;

function vocabQs(L,n,seen){const out=[];for(const w of shuffle(L.words.slice())){if(out.length>=n)break;if(seen.has("w"+w.id))continue;seen.add("w"+w.id);out.push(vocabQ(w,Math.random()<.5?"ar":"fr"));}return out;}
function gramQs(L,n,seen){const fs=L.stat.map((_,i)=>()=>statQ(L,i)).concat(L.bookFlat.map((_,i)=>()=>bookQ(L,i)),L.ordS.map((_,i)=>()=>ordQ(L,i)));

 const out=[];let i=0;while(out.length<n&&i<fs.length*6){const q=fs[i%fs.length]();i++;if(i%fs.length===0)shuffle(fs);if(seen.has(q.key))continue;seen.add(q.key);out.push(q);}return out;}

LESSONS.forEach(L=>{L.stat.forEach((s,i)=>addP(s[0],()=>statQ(L,i)));L.bookFlat.forEach((b,i)=>addP(b.tag,()=>bookQ(L,i)));L.ordS.forEach((_,i)=>addP("Construire une phrase (L"+L.n+")",()=>ordQ(L,i)));

  cur={click(b){const d=b.dataset;if(d.c!=null){if(!locked&&!built.includes(+d.c)&&built.length<q.ans.length){built.push(+d.c);draw();}return true;}if(d.u!=null){if(!locked){built.splice(+d.u,1);draw();}return true;}
   if(b.hasAttribute("data-clear")){if(!locked){built.length=0;draw();}return true;}if(b.hasAttribute("data-check")){check();return true;}if(b.hasAttribute("data-next")){go();return true;}return false;},
   key(e){if(locked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();go();}}};
  return;}
 const cls=q.vow?" six":q.o.length===2?" two":"";
 app.innerHTML=head+promptHtml(q)+`<div class="opts${cls}">${q.o.map((x,i)=>`<button class="opt${!q.vow&&isAr(x)?" oar"+(x.length>22?" long":""):""}" data-i="${i}">${optInner(q,x)}</button>`).join("")}</div><div class="fb" id="fb" aria-live="polite"></div>`;
 function pick2(i){
  if(locked)return;locked=true;const ok=i===q.a,bs=app.querySelectorAll(".opt");bs.forEach(b=>{b.disabled=true;});after(ok,i);
  if(o.mode==="exam"){bs[i].classList.add("picked");timer=setTimeout(go,300);return;}
  bs[q.a].classList.add("ok");if(!ok)bs[i].classList.add("ko");
  document.getElementById("fb").innerHTML=feedback(q,ok);
  if(ok&&o.auto)timer=setTimeout(go,o.auto);else{const n=app.querySelector("[data-next]");if(n)n.focus({preventScroll:true});}}
 cur={click(b){if(b.dataset.i!=null){pick2(+b.dataset.i);return true;}if(b.hasAttribute("data-next")){go();return true;}return false;},
  key(e){if(!locked&&/^[1-6]$/.test(e.key)){const i=+e.key-1;if(i<q.o.length){e.preventDefault();pick2(i);}}else if(locked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();go();}}};
}

function parts(L){const a=[{k:"c"}];L.decks.filter(d=>!d.bonus).forEach(d=>a.push({k:"d",d}));a.push({k:"b"},{k:"e"});return a;}
function partTitle(p){return p.k==="c"?"Cours":p.k==="d"?p.d.title:p.k==="b"?"Exercices du livre":"Examen";}
function nextAfter(L,k,id){const ps=parts(L),i=ps.findIndex(p=>p.k===k&&(k!=="d"||p.d.id===id));return ps[i+1]||null;}
function goPart(L,p){if(!p)return lessonView(L);if(p.k==="c")coursView(L);else if(p.k==="d")list(p.d);else if(p.k==="b")bookStart(L);else examStart(L);}

/* ----- Entraînement vocabulaire (avec reprise) ----- */
function drill(d){runDrill({kind:"drill",d:d.id,queue:shuffle(d.words.map(w=>[w.id,0])),done:0,errs:0,t0:Date.now()});}
function runDrill(st){
 S.sess=st;save();const d=DECK[st.d],total=d.words.length,title=`Leçon ${d.L.n}, ${lc(d.title)}`;
 const meta=()=>({meta:`${st.done}/${total} maîtrisés`,pct:st.done/total*100});
 function step(){if(!st.queue.length)return finish();const c=st.queue[0],w=WBY[c[0]];if(!w){st.queue.shift();return step();}const q=vocabQ(w,c[1]===0?"ar":"fr");
  showQ(q,Object.assign({title,mode:"learn",auto:w.note?1500:850,onAnswer(ok){record(q,ok);st.queue.shift();if(ok){c[1]++;if(c[1]>=2)st.done++;else st.queue.splice(Math.min(st.queue.length,3+(Math.random()*3|0)),0,c);}else{st.errs++;c[1]=0;st.queue.splice(Math.min(st.queue.length,2),0,c);}save();return meta();},next:step},meta()));}
 function finish(){setView("end");S.sess=null;LS(d.L.id).d[d.id]=1;save();const nx=d.bonus?null:nextAfter(d.L,"d",d.id),m=Math.round((Date.now()-st.t0)/60000);
  acts={next:()=>goPart(d.L,nx),redo:()=>drill(d)};
  app.innerHTML=`<div class="end"><p class="endar" lang="ar" dir="rtl">أَحْسَنْتَ</p><h1>${esc(d.title)} : ${total} ${d.unit} maîtrisés</h1><p class="meta">${st.errs} erreur${st.errs>1?"s":""}${m>0&&m<300?` en ${m} min`:""}.</p><div class="sact">${nx?`<button class="btn solid" data-act="next">Suite : ${esc(lc(partTitle(nx)))}</button>`:""}<button class="btn" data-act="redo">Recommencer</button>${back(d.L)}</div></div>`;}
 step();
}

/* ----- Séries de questions (avec reprise) ----- */
function bookStart(L){runQuiz({sub:"book",mode:"learn",title:`Leçon ${L.n}, exercices du livre`,L:L.id,qs:L.bookFlat.map((_,i)=>bookQ(L,i))});}
function extraStart(L){runQuiz({sub:"extra",mode:"learn",title:`Leçon ${L.n}, exercices d’entraînement`,L:L.id,qs:shuffle(L.xIdx.map(i=>statQ(L,i)))});}
function freeStart(L){runQuiz({sub:"free",mode:"learn",title:`Leçon ${L.n}, entraînement libre`,L:L.id,qs:gramQs(L,L.freeN,new Set())});}
function examStart(L){const seen=new Set();runQuiz({sub:"exam",mode:"exam",title:`Leçon ${L.n}, examen`,L:L.id,qs:shuffle(vocabQs(L,L.ex.v,seen).concat(gramQs(L,L.ex.g,seen)))});}
function finalStart(){const seen=new Set();let qs=[];LESSONS.forEach(L=>{qs=qs.concat(vocabQs(L,L.fin.v,seen),gramQs(L,L.fin.g,seen));});runQuiz({sub:"final",mode:"exam",title:"Examen final",L:null,qs:shuffle(qs)});}
function reviewStart(){const qs=shuffle(dueKeys()).slice(0,20).map(srcQ).filter(Boolean);if(!qs.length)return home();runQuiz({sub:"review",mode:"learn",title:"À revoir aujourd’hui",L:null,qs});}
function weakStart(){const tags=weakTags().filter(x=>x.r<.85).slice(0,3).map(x=>x.t);if(!tags.length)return home();const seen=new Set(),qs=[];let i=0;
 while(qs.length<15&&i<200){const t=tags[i%tags.length];i++;const q=pick(PROD[t])();if(seen.has(q.key))continue;seen.add(q.key);qs.push(q);}
 runQuiz({sub:"weak",mode:"learn",title:"Mes points faibles",L:null,qs});}
function corrItem(q,pv){const mine=q.type==="ord"?`<bdi class="arin">${esc(pv)}</bdi>`:optText(q,q.o[pv]),good=q.type==="ord"?`<bdi class="arin">${esc(q.ans.join(" "))}</bdi>`:optText(q,q.o[q.a]);
 return `<li class="corr">${q.th?`<div class="meta">${esc(q.th)}</div>`:""}<div>${mixP(q.p)}</div>${q.vow?`<div class="qars" lang="ar" dir="rtl">${esc(q.pre)}<span class="tgt">${esc(q.stem)}</span>${esc(q.post)}</div>`:q.ar?`<div class="qars" lang="ar" dir="rtl">${esc(q.ar)}</div>`:""}${q.pfr?`<div><strong>${mixP(q.pfr)}</strong></div>`:""}<div class="cbad">Ta réponse : ${mine}</div><div class="cgood">Bonne réponse : ${good}</div>${q.e?`<div class="note">${mixS(q.e)}</div>`:""}</li>`;}
function runQuiz(c){
 c.kind="quiz";c.k=c.k||0;c.score=c.score||0;c.ans=c.ans||[];S.sess=c;save();
 const L=c.L?LBY[c.L]:null,n=c.qs.length;
 const meta=()=>c.mode==="exam"?{meta:`Question ${Math.min(c.k+1,n)} sur ${n}`,pct:c.k/n*100}:{meta:`${c.k}/${n} faites, ${c.score} juste${c.score>1?"s":""}`,pct:c.k/n*100};
 function step(){if(c.k>=n)return end();const q=c.qs[c.k];
  showQ(q,Object.assign({title:c.title,mode:c.mode,auto:c.mode==="learn"?2600:0,onAnswer(ok,pv){record(q,ok);c.ans.push({i:c.k,p:pv,ok});c.k++;if(ok)c.score++;save();return meta();},next:step},meta()));}
 function end(){
  setView("end");S.sess=null;const pct=Math.round(c.score/n*100),wrong=c.ans.filter(a=>!a.ok);let h="",msg="",nxBtn="";
  acts.errs=()=>runQuiz({sub:"err",mode:"learn",title:"Mes erreurs",L:c.L,qs:wrong.map(a=>reshuf(c.qs[a.i]))});
  const errBtn=wrong.length?`<button class="btn${c.sub==="exam"||c.sub==="final"?(pct>=80?"":" solid"):""}" data-act="errs">${c.mode==="exam"?"Réviser":"Refaire"} mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>`:"";
  const homeBtn=L?back(L):`<button class="btn" data-home>Accueil</button>`;
  if(c.sub==="exam"||c.sub==="final"){
   if(L){const s=LS(L.id);if(s.e==null||pct>s.e)s.e=pct;const nxL=LESSONS[L.n];
    msg=pct>=80?"Objectif atteint : leçon maîtrisée.":`Objectif : 80 % (${Math.ceil(n*.8)}/${n}). Révise tes erreurs, puis repasse l’examen : les questions changent.`;
    nxBtn=nxL?`<button class="btn solid" data-lesson="${nxL.id}">Leçon ${nxL.n}</button>`:`<button class="btn solid" data-final>Examen final</button>`;}
   else{S.fin.hist=S.fin.hist.concat([pct]).slice(-5);if(S.fin.best==null||pct>S.fin.best)S.fin.best=pct;
    msg=pct>=90?"Excellent : tout est acquis.":pct>=80?"Réussi. Revois tes erreurs pour viser 100 %.":"Pas encore : revois les leçons de tes erreurs, puis relance. Les questions seront différentes.";}
   acts.retry=()=>L?examStart(L):finalStart();
   h=`<p class="score">${pct} %</p><p class="meta">${c.score}/${n} bonnes réponses</p><h1>${msg}</h1><div class="sact">${nxBtn}${errBtn}<button class="btn" data-act="retry">${L?"Repasser l’examen":"Nouvel examen final"}</button>${homeBtn}</div>${wrong.length?`<section class="errs"><h2 class="th">Correction</h2><ol class="rows">${wrong.map(a=>corrItem(c.qs[a.i],a.p)).join("")}</ol></section>`:""}`;
  }else{
   let next="";
   if(c.sub==="book"&&L){const s=LS(L.id);if(s.b==null||c.score>s.b)s.b=c.score;const nx=nextAfter(L,"b");acts.next=()=>goPart(L,nx);next=`<button class="btn solid" data-act="next">Suite : examen</button>`;acts.redo=()=>bookStart(L);}
   else if(c.sub==="extra"&&L){const s=LS(L.id);if(s.x==null||c.score>s.x)s.x=c.score;acts.redo=()=>extraStart(L);}
   else if(c.sub==="free"&&L){const s=LS(L.id);if(s.f==null||c.score>s.f)s.f=c.score;acts.redo=()=>freeStart(L);}
   else if(c.sub==="review")acts.redo=()=>reviewStart();
   else if(c.sub==="weak")acts.redo=()=>weakStart();
   else acts.redo=()=>runQuiz({sub:c.sub,mode:"learn",title:c.title,L:c.L,qs:c.qs.map(reshuf)});
   const redoLbl=c.sub==="free"||c.sub==="extra"?"Nouvelle série":c.sub==="review"?(dueKeys().length?"Continuer les révisions":""):c.sub==="weak"?"Nouvelle série":"Recommencer";
   h=`<p class="score">${c.score}/${n}</p><h1>${c.score===n?"Tout juste.":"Série terminée."}</h1>${c.sub==="review"?`<p class="meta">Les questions réussies reviendront dans quelques jours ; les ratées restent à revoir.</p>`:""}<div class="sact">${next}${errBtn}${redoLbl?`<button class="btn" data-act="redo">${redoLbl}</button>`:""}${homeBtn}</div>`;
  }
  save();app.innerHTML=`<div class="end">${h}</div>`;
 }
 step();
}
function resume(){const s=S.sess;if(!s)return home();if(s.kind==="drill"){if(DECK[s.d])return runDrill(s);}else if(s.qs&&s.qs.length)return runQuiz(s);S.sess=null;save();home();}

/* ================= Événements ================= */
app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||b.disabled)return;const ds=b.dataset;
 if(ds.say!=null){e.stopPropagation();speak(ds.say);return;}
 if(cur&&cur.click(b))return;
 if(ds.act){const f=acts[ds.act];if(f)f();return;}
 if(ds.lesson){const L=LBY[ds.lesson];if(L&&unlocked(L))lessonView(L);return;}
 if(ds.cours)return coursView(LBY[ds.cours]);
 if(ds.coursdone){const L=LBY[ds.coursdone];LS(L.id).c=1;save();return goPart(L,nextAfter(L,"c"));}
 if(ds.list)return list(DECK[ds.list]);
 if(ds.drill)return drill(DECK[ds.drill]);
 if(ds.book)return bookStart(LBY[ds.book]);
 if(ds.extra)return extraStart(LBY[ds.extra]);
 if(ds.free)return freeStart(LBY[ds.free]);
 if(ds.exam)return examStart(LBY[ds.exam]);
 if("final" in ds){if(finalOpen())finalStart();return;}
 if("review" in ds)return reviewStart();
 if("weak" in ds)return weakStart();
 if("resume" in ds)return resume();
 if("drop" in ds){S.sess=null;save();return home();}
 if("home" in ds)return home();
 if("reset" in ds){if(ds.armed){S=fresh();S.t=Date.now();save();flush();tick();return home();}ds.armed="1";b.classList.add("armed");b.textContent="Confirmer : tout effacer";setTimeout(()=>{if(b.isConnected){delete ds.armed;b.classList.remove("armed");b.textContent="Tout recommencer";}},5000);}
});
document.getElementById("homeBtn").addEventListener("click",home);
document.addEventListener("keydown",e=>{if(cur&&cur.key)cur.key(e);});
home();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
